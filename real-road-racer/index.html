<!DOCTYPE html>
<html lang="en">
<head>
      <link rel="icon" type="image/x-icon" href="icon.ico">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real Road Racer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <header>
    <img src="logo.svg" alt="REAL ROAD RACER" class="logo">
    <p class="tag">Race on real roads, anywhere in the world</p>
  </header>
  <canvas id="car3d" aria-label="3D model of your car. Drag to rotate, scroll to zoom."></canvas>
  <p class="hint">Drag the car to rotate it &middot; scroll to zoom</p>
  <nav class="buttons">
    <a class="mbtn primary" href="freeplay.html" data-gp-default="1">Free-Play</a>
    <a class="mbtn" href="story.html">Story Mode</a>
    <a class="mbtn" href="contracts.html">Contracts <small>Coming soon</small></a>
    <a class="mbtn" href="settings.html">Settings</a>
  </nav>
  <footer style="margin-top: 18px; text-align: center;">
    <a href="copyright.html" data-copyright="1" style="color: var(--muted, #a9b3c4); font-size: 13px; text-decoration: none;">&copy; Ale.10 &middot; Copyright & Attributions</a>
  </footer>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="shared.js"></script>
<script>
const S = RR.load();
const v = RR.viewer(document.getElementById('car3d'), { color:S.color, shadows:S.shadows });
RR.nav.start(); // controller: stick / D-pad moves the blue outline, A opens, Select = Copyright, right stick spins the car
addEventListener('pageshow', () => { const s = RR.load(); v.setColor(s.color); v.setShadows(s.shadows); }); // refresh after coming back from Settings
</script>
</body>
</html>
