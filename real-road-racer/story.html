<!DOCTYPE html>
<html lang="en">
<head> 
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Mode · Real Road Racer</title>
<style>
  :root { --ink:#f3ede4; --panel:rgba(22,28,40,.82); --accent:#f2a65a; --muted:#a9b3c4; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#1b2434; color:var(--ink);
    font:15px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif; }
  canvas { display:block; }
  #panel { position:fixed; top:12px; left:12px; width:min(340px,calc(100% - 24px)); background:var(--panel);
    border-radius:10px; padding:14px; backdrop-filter:blur(6px); }
  #panel h1 { font-size:17px; margin:0 0 10px; font-weight:700; letter-spacing:.2px; }
  label { display:block; font-size:13px; color:var(--muted); margin:8px 0 3px; }
  input[type=text], input[type=number] { width:100%; padding:7px 9px; border-radius:6px; border:1px solid #3a475e;
    background:#121926; color:var(--ink); font:inherit; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .row { display:flex; gap:8px; align-items:center; }
  .row > * { flex:1; }
  .check { display:flex; gap:7px; align-items:center; margin-top:10px; color:var(--muted); font-size:13px; }
  .check input { flex:none; }
  button { margin-top:12px; width:100%; padding:9px; border:0; border-radius:6px; background:var(--accent);
    color:#2a1c0c; font:inherit; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.55; cursor:wait; }
  #status { margin-top:10px; font-size:13px; color:var(--muted); min-height:1.4em; }
  #status.err { color:#ff9c8f; }
  #hud { position:fixed; right:14px; bottom:14px; text-align:right; text-shadow:0 1px 6px rgba(0,0,0,.6); pointer-events:none; }
  #speed { font-size:54px; font-weight:700; line-height:1; }
  #speed small { font-size:16px; font-weight:400; margin-left:4px; }
  #info { font-size:14px; color:var(--ink); }
  #help { position:fixed; left:14px; bottom:12px; max-width:min(540px,calc(100vw - 290px)); font-size:12px; line-height:2; color:var(--muted); text-shadow:0 1px 6px rgba(0,0,0,.7); pointer-events:none; }
  #help .hk { display:inline-block; white-space:nowrap; margin-right:14px; }
  #help kbd { font:inherit; font-weight:700; color:var(--ink); background:rgba(22,28,40,.8); border:1px solid rgba(255,255,255,.2); border-radius:4px; padding:0 6px; margin:0 1px; }
  #msg { position:fixed; top:40%; left:50%; transform:translate(-50%,-50%); font-size:30px; font-weight:700;
    text-shadow:0 2px 12px rgba(0,0,0,.7); display:none; text-align:center; }
  #panel { max-height:calc(100% - 24px); overflow:auto; }
  #map { height:170px; border-radius:6px; margin:6px 0 2px; }
  h2 { font-size:14px; margin:16px 0 2px; }
  select { width:100%; padding:7px 9px; border-radius:6px; border:1px solid #3a475e; background:#121926; color:var(--ink); font:inherit; }
  #garage button { margin:4px 0 0; background:#26324a; color:var(--ink); text-align:left; font-weight:400; padding:7px 9px; }
  #garage button.sel { outline:2px solid var(--accent); }
  #manual { display:none; margin-top:6px; }
  .card { background:var(--panel); border-radius:12px; padding:18px; width:min(380px,100%); backdrop-filter:blur(6px); }
  #menu, #loading, #countdown, #finish { display:none; position:fixed; inset:0; }
  body[data-s=menu] #menu, body[data-s=confirm] #menu { display:flex; }
  body[data-s=loading] #loading, body[data-s=countdown] #countdown, body[data-s=race] #countdown, body[data-s=finished] #finish { display:flex; }
  body[data-s=menu] #confirmPanel, body[data-s=confirm] #formPanel { display:none; }
  #menu { background:linear-gradient(160deg,#18202e,#26344d); padding:16px; gap:16px; align-items:stretch; }
  #menu #map { flex:1; height:auto; margin:0; min-height:240px; }
  #formPanel, #confirmPanel { align-self:flex-start; max-height:100%; overflow:auto; }
  @media (max-width:760px) { #menu { flex-direction:column; } #formPanel, #confirmPanel { width:100%; } }
  .row2 { display:flex; gap:8px; } .row2 input[type=text] { flex:1; min-width:0; } .row2 button { width:auto; margin:0; padding:0 12px; }
  input[type=color] { width:52px; height:38px; padding:2px; border:1px solid #3a475e; border-radius:6px; background:#121926; cursor:pointer; }
  button.alt { background:#26324a; color:var(--ink); }
  #sum div { margin:7px 0; word-break:break-word; } #sum b { color:var(--accent); }
  #loading, #countdown, #finish { align-items:center; justify-content:center; flex-direction:column; }
  #loading { background:#18202e; } #finish { background:rgba(10,14,22,.72); } #countdown { pointer-events:none; }
  .big { font-size:min(22vw,160px); font-weight:800; text-shadow:0 4px 24px rgba(0,0,0,.6); }
  #loadmsg { font-size:20px; font-weight:600; } #ftime { font-size:22px; margin:8px 0 4px; }
  #note { position:fixed; left:50%; transform:translateX(-50%); bottom:38px; font-size:12px; color:#ff9c8f; text-align:center; }
  #mini { position:fixed; top:12px; right:12px; width:220px; height:160px; border-radius:10px; box-shadow:0 2px 12px rgba(0,0,0,.4); }
  #tools { position:fixed; top:12px; left:12px; display:none; gap:8px; }
  .tool { width:auto; margin:0; padding:7px 12px; background:rgba(22,28,40,.78); color:var(--ink); font-weight:600; }
  #touch { display:none; }
  #touch button { position:fixed; bottom:18px; width:78px; height:78px; margin:0; padding:0; border-radius:50%; background:rgba(22,28,40,.6);
    color:#fff; font-size:26px; touch-action:none; user-select:none; -webkit-user-select:none; border:2px solid rgba(255,255,255,.25); }
  #touch svg { width:36px; height:36px; stroke:#fff; stroke-width:2.6; fill:none; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
  #touch [data-k=left] { left:12px; } #touch [data-k=right] { left:100px; } #touch [data-k=down] { right:100px; } #touch [data-k=up] { right:12px; }
  body[data-touch="1"] #hud { bottom:110px; } body[data-touch="1"] #help { display:none !important; }
  body[data-s=countdown] #tools, body[data-s=race] #tools, body[data-s=finished] #tools { display:flex; }
  body[data-touch="1"][data-s=countdown] #touch, body[data-touch="1"][data-s=race] #touch { display:block; }
  #limit { position:fixed; top:12px; left:50%; transform:translateX(-50%); display:none; text-align:center; pointer-events:none; }
  #limNum { width:68px; height:68px; border-radius:50%; background:#fff; border:7px solid #d62d2d; color:#111; font:800 24px/54px "Trebuchet MS",sans-serif; margin:0 auto; }
  #limit.over #limNum { animation:pulse .45s infinite alternate; } @keyframes pulse { to { background:#ffd0d0; } }
  #limWarn { margin-top:6px; color:#ff9c8f; font-weight:700; text-shadow:0 1px 6px rgba(0,0,0,.8); min-height:1.4em; }
  #toast { position:fixed; top:140px; left:50%; transform:translateX(-50%); font-size:32px; font-weight:800; color:#ff6b5e; text-shadow:0 2px 14px rgba(0,0,0,.8); display:none; pointer-events:none; white-space:nowrap; }
  body[data-legal="1"][data-s=countdown] #limit, body[data-legal="1"][data-s=race] #limit { display:block; }
  #hud, #help, #note, #mini { display:none; }
  body[data-s=countdown] :is(#hud,#help,#note,#mini), body[data-s=race] :is(#hud,#help,#note,#mini), body[data-s=finished] :is(#hud,#help,#note,#mini) { display:block; }
  a.tool { display:flex; align-items:center; padding:7px 12px; border-radius:6px; background:rgba(22,28,40,.78); color:var(--ink); font-weight:600; text-decoration:none; }
  a.btn { display:block; margin-top:12px; padding:9px; border-radius:6px; background:#26324a; color:var(--ink); font-weight:700; text-align:center; text-decoration:none; }
  .row2 button.pick { white-space:nowrap; } .row2 button.pick.on[data-k=a] { background:#2ecc71; color:#0c2a16; } .row2 button.pick.on[data-k=b] { background:#e74c3c; color:#fff; }
  .hint { font-size:12px; color:var(--muted); margin:8px 0 0; }
  #map.picking, #map.picking.leaflet-grab, #map.picking .leaflet-interactive { cursor:crosshair !important; }
  #driftTag { font-size:22px; font-weight:800; letter-spacing:2px; color:var(--accent); visibility:hidden; }
  #touch :is([data-k=hand],[data-k=look]) { bottom:106px; font-size:13px; font-weight:800; letter-spacing:.5px; } #touch [data-k=hand] { right:12px; } #touch [data-k=look] { left:12px; }
  #chapters, #cut { display:none; position:fixed; inset:0; }
  body[data-s=chapters] #chapters { display:block; overflow:auto; background:linear-gradient(160deg,#18202e,#26344d); padding:20px 16px 40px; }
  body[data-s=cutscene] #cut { display:block; background:#000; }
  .cwrap { max-width:820px; margin:0 auto; } .cwrap h1 { font-size:34px; margin:12px 0 0; } .cwrap .sub { margin:2px 0 16px; color:var(--accent); letter-spacing:2px; font-weight:700; }
  a.btn.small { display:inline-block; width:auto; margin:0; padding:8px 14px; }
  .ccard { display:flex; gap:14px; align-items:center; background:var(--panel); border-radius:12px; padding:14px 16px; margin:10px 0; border-left:5px solid var(--accent); }
  .ccard.locked { opacity:.5; border-left-color:#3a475e; } .ccard .num { font-size:30px; font-weight:800; width:34px; text-align:center; color:var(--accent); }
  .ccard .body { flex:1; min-width:0; } .ccard h3 { margin:0; font-size:18px; } .ccard .meta { font-size:13px; color:var(--muted); margin-top:2px; }
  .ccard button { width:auto; margin:0; padding:9px 18px; } .cbar { margin-top:16px; display:flex; gap:8px; flex-wrap:wrap; } .cbar button { width:auto; margin:0; padding:9px 14px; }
  #cmsg { margin-top:12px; color:#ff9c8f; min-height:1.4em; }
  #cutBg { position:absolute; inset:0; overflow:hidden; } #cutBg svg { width:100%; height:100%; display:block; transform-origin:50% 60%; animation:drift 22s linear forwards; }
  #cutBg::after { content:""; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(0,0,0,.55)); pointer-events:none; }
  .cbarT, .cbarB { position:absolute; left:0; right:0; background:#000; z-index:2; height:0; animation:bar .8s ease-out forwards; } .cbarT { top:0; } .cbarB { bottom:0; }
  #cutBox { position:absolute; z-index:3; left:50%; transform:translateX(-50%); bottom:13vh; width:min(900px,92%); background:rgba(10,14,22,.86); border-radius:8px; padding:14px 18px 12px; border-left:4px solid var(--accent); min-height:96px; }
  #cutWho { font-weight:800; letter-spacing:1.5px; font-size:14px; text-transform:uppercase; margin-bottom:4px; } #cutTxt { font-size:19px; line-height:1.45; } #cutTxt.nar { font-style:italic; color:#d6dbe6; }
  #cutHint { text-align:right; font-size:12px; color:var(--muted); margin-top:4px; visibility:hidden; }
  #cutSkip { position:absolute; z-index:4; top:12px; right:12px; width:auto; margin:0; padding:6px 12px; background:rgba(22,28,40,.7); color:var(--ink); }
  .bob { animation:bob 1.2s ease-in-out infinite alternate; } .dash { animation:dash .5s linear infinite; } .rain { animation:rain .45s linear infinite; }
  @keyframes drift { to { transform:scale(1.08); } } @keyframes bar { to { height:11vh; } } @keyframes bob { to { transform:translateY(-3px); } }
  @keyframes dash { to { stroke-dashoffset:-130; } } @keyframes rain { to { transform:translate(-80px,200px); } }
  #chase, #tmark { display:none; position:fixed; pointer-events:none; text-shadow:0 1px 6px rgba(0,0,0,.8); }
  #chase { top:12px; left:50%; transform:translateX(-50%); text-align:center; min-width:190px; }
  body[data-s=countdown] :is(#chase,#tmark,#talk), body[data-s=race] :is(#chase,#tmark,#talk) { display:block; }
  #cName { font-size:12px; letter-spacing:2px; color:var(--muted); } #cDist { font-size:34px; font-weight:800; line-height:1.05; }
  #cBars { position:relative; height:8px; background:rgba(0,0,0,.5); border-radius:4px; overflow:hidden; margin-top:4px; }
  #cBar { height:100%; width:0; background:var(--accent); } #cNote { min-height:1.4em; font-weight:800; color:#ff9c4d; }
  #cHits { margin-top:6px; } #cHits i { display:inline-block; width:18px; height:18px; margin:0 3px; border-radius:50%; border:2px solid #fff; background:rgba(0,0,0,.45); } #cHits i.on { background:#ff4d4d; border-color:#ff4d4d; }
  #talk { display:none; position:fixed; top:128px; left:50%; transform:translateX(-50%); max-width:min(560px,90%); padding:8px 14px; border-radius:10px; background:rgba(10,14,22,.82); font-size:17px; font-weight:600; text-align:center; pointer-events:none; opacity:0; transition:opacity .25s; }
  #tWho { text-transform:uppercase; letter-spacing:1px; font-size:13px; margin-right:6px; }
  #tmark { transform:translate(-50%,-50%); padding:2px 9px; border-radius:11px; background:rgba(220,60,60,.88); color:#fff; font-weight:700; font-size:13px; white-space:nowrap; }
</style>
</head>
<body>
<div id="status" style="display:none"></div>
<div id="chapters"><div class="cwrap">
  <a class="btn small" href="index.html">← Main menu</a>
  <h1>Story Mode</h1><div class="sub">RUN THEM DOWN</div>
  <div id="clist"></div>
  <div class="cbar"><button class="alt" id="watchP">▶ Watch prologue</button><button class="alt" id="resetP">Reset progress</button></div>
  <div id="cmsg"></div>
</div></div>
<div id="cut"><div id="cutBg"></div><div class="cbarT"></div><div class="cbarB"></div>
  <button id="cutSkip" class="alt">Skip ▸▸</button>
  <div id="cutBox"><div id="cutWho"></div><div id="cutTxt"></div><div id="cutHint">Click or press Space to continue</div></div>
</div>
<div id="chase"><div id="cName"></div><div id="cDist">0 m</div><div id="cBars"><div id="cBar"></div></div><div id="cHits"><i></i><i></i><i></i></div><div id="cNote"></div></div>
<div id="talk"><b id="tWho"></b><span id="tTxt"></span></div>
<div id="tmark"></div>
<div id="loading"><div id="loadmsg">Building track…</div></div>
<div id="countdown"><div class="big" id="cd"></div></div>
<div id="finish"><div class="card"><h1 id="fh">They got away</h1><div id="ftime"></div><button id="retry">Retry</button><button id="tomenu" class="alt">Chapters</button></div></div>
<div id="note"></div>
<div id="limit"><div id="limNum">50</div><div id="limWarn"></div></div>
<div id="toast"></div>
<div id="tools"><button class="tool" id="chapBtn" title="Back to chapters">☰ Chapters</button><button class="tool" id="muteBtn" title="Sound" aria-label="Toggle sound">🔊</button><button class="tool" id="camBtn" title="Camera">🎥 Chase</button></div>
<div id="touch"><button data-k="left" aria-label="Steer left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"/></svg></button><button data-k="right" aria-label="Steer right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button><button data-k="down" aria-label="Brake and reverse"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v15M6 13l6 6 6-6"/></svg></button><button data-k="hand" aria-label="Handbrake / drift">DRIFT</button><button data-k="up" aria-label="Accelerate"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V5M6 11l6-6 6 6"/></svg></button><button data-k="look" aria-label="Look behind (hold)">REAR</button></div>
<canvas id="mini" width="220" height="160"></canvas>
<div id="hud"><div id="speed">0<small>km/h</small></div><div id="info"></div><div id="driftTag">DRIFT!</div></div>
<div id="help"></div>
<div id="msg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="shared.js"></script>
<script>
const $ = id => document.getElementById(id);
const statusEl = $('status');
const say = (t, err) => { statusEl.textContent = t; statusEl.className = err ? 'err' : ''; $('loadmsg').textContent = t; };

/* ---------- Three.js scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bb3cc);
scene.fog = new THREE.Fog(0x9bb3cc, 20, 320);
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.5, 3000);
const hemi = new THREE.HemisphereLight(0xdfe9f5, 0x3b4a3a, 0.9); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe2b8, 0.8);
sun.position.set(-200, 300, 120);
scene.add(sun); scene.add(sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0004; sun.shadow.normalBias = .4;
Object.assign(sun.shadow.camera, { left:-90, right:90, top:90, bottom:-90, near:1, far:420 }); sun.shadow.camera.updateProjectionMatrix();
const sunDir = new THREE.Vector3(-200, 300, 120).normalize();
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
});

// Car classes (generic archetypes; swap in real models later)
const CLASSES = {
  hatch:  { name:'Hatchback', len:3.9, w:1.75, h:.7,  cab:.55, m:1100, P:55000,  cda:.70,  mu:1.00, df:0,      vmax:50 },
};
for (const c of Object.values(CLASSES)) { // top speed where engine power = air drag + rolling resistance
  let lo = 1, hi = 150;
  for (let i = 0; i < 40; i++) { const v = (lo + hi) / 2; if (c.P / v > .5 * 1.2 * c.cda * v * v + .012 * c.m * 9.81) lo = v; else hi = v; }
  c.top = Math.min(lo, c.vmax);
}
const car = new THREE.Group(); scene.add(car);
const head = new THREE.SpotLight(0xfff1d0, 0, 80, .55, .6, 1); // headlights
let env = { weather:'Clear', time:'Day', legal:false, shadows:true }, headBase = 0;
let cur = CLASSES.hatch;
function setCar(c) {
  cur = CLASSES[c.cls]; car.clear();
  const body = new THREE.Mesh(new THREE.BoxGeometry(cur.w, cur.h, cur.len), new THREE.MeshLambertMaterial({ color:c.color }));
  body.position.y = .35 + cur.h / 2;
  const cab = new THREE.Mesh(new THREE.BoxGeometry(cur.w * .82, cur.cab, cur.len * .45), new THREE.MeshLambertMaterial({ color:0x1d2633 }));
  cab.position.set(0, .35 + cur.h + cur.cab / 2, -cur.len * .05);
  car.add(body, cab);
  const wr = .33, ww = .25, tire = new THREE.MeshLambertMaterial({ color:0x15171b }), hub = new THREE.MeshLambertMaterial({ color:0xb7bcc6 });
  car.userData.wheels = []; car.userData.pivots = [];
  for (const [sx, sz] of [[-1, 1], [1, 1], [-1, -1], [1, -1]]) {
    const piv = new THREE.Group(), spin = new THREE.Group();
    piv.position.set(sx * (cur.w / 2 - .05), wr, sz * cur.len * .32);
    const t = new THREE.Mesh(new THREE.CylinderGeometry(wr, wr, ww, 18), tire); t.rotation.z = Math.PI / 2;
    const hb = new THREE.Mesh(new THREE.CylinderGeometry(wr * .55, wr * .55, ww + .02, 10), hub); hb.rotation.z = Math.PI / 2;
    const spoke = new THREE.Mesh(new THREE.BoxGeometry(ww + .04, wr * 1.5, .07), tire);
    spin.add(t, hb, spoke); piv.add(spin); car.add(piv);
    car.userData.wheels.push(spin); if (sz > 0) car.userData.pivots.push(piv);
  }
  const hl = new THREE.MeshBasicMaterial({ color:0xfff3c4 }), tl = new THREE.MeshBasicMaterial({ color:0x6b1111 }); car.userData.tail = tl;
  for (const sx of [-1, 1]) {
    const a = new THREE.Mesh(new THREE.BoxGeometry(.32, .14, .06), hl); a.position.set(sx * cur.w * .32, .35 + cur.h * .62, cur.len / 2 + .01);
    const b = new THREE.Mesh(new THREE.BoxGeometry(.34, .14, .06), tl); b.position.set(sx * cur.w * .32, .35 + cur.h * .68, -cur.len / 2 - .01);
    car.add(a, b);
  }
  car.traverse(o => { if (o.isMesh) o.castShadow = o.receiveShadow = true; });
  head.position.set(0, .35 + cur.h * .7, cur.len / 2); head.target.position.set(0, .2, cur.len / 2 + 20); car.add(head, head.target);
}

let trackGroup = null, track = null; // track = {pts:[Vector3], n, length}

/* ---------- Geo helpers ---------- */
function parseLatLon(s) {
  const m = s.match(/(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)/);
  if (!m) throw new Error('Could not read coordinates: "' + s + '". Use the form 45.4641, 9.1919');
  return { lat:+m[1], lon:+m[2] };
}
function haversine(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r) * Math.cos(b.lat*r) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

/* ---------- Data fetching ---------- */
async function fetchRoute(a, b) {
  const url = `https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('Routing service returned ' + r.status);
  const j = await r.json();
  if (!j.routes || !j.routes.length) throw new Error('No drivable route found between those points.');
  return j.routes[0].geometry.coordinates.map(c => ({ lon:c[0], lat:c[1] }));

/* ---------- Chapter flow ---------- */
const el = (t, c) => { const e = document.createElement(t); if (c) e.className = c; return e; };
function renderChapters() {
  const list = $('clist'); list.replaceChildren();
  CHAPTERS.forEach((c, i) => {
    const locked = c.id > P.unlocked, d = el('div', 'ccard' + (locked ? ' locked' : '')), n = el('div', 'num'), b = el('div', 'body'), h = el('h3'), m = el('div', 'meta'), btn = el('button');
    n.textContent = locked ? '🔒' : c.id; h.textContent = c.title + ' · ' + c.city;
    m.textContent = locked ? 'Take down ' + CHAPTERS[i - 1].target + ' to unlock' : 'Target: ' + c.target + ' · ' + c.weather + ', ' + c.time.toLowerCase() + ' · last life: ' + c.abilName.toLowerCase() + (P.best[c.id] ? ' · ✓ best ' + P.best[c.id].toFixed(1) + ' s' : '');
    btn.textContent = P.best[c.id] ? 'Replay' : 'Play'; btn.disabled = locked; btn.onclick = () => openChapter(i);
    b.append(h, m); d.append(n, b, btn); list.append(d);
  });
}
function toChapters() { CH = null; clearHazards(); P = loadP(); setState('chapters'); renderChapters(); }
async function prepare(c) {
  const a = { lat:c.a[0], lon:c.a[1] }, b = { lat:c.b[0], lon:c.b[1] };
  const coords = await fetchRoute(a, b); await buildTrack(a, b, coords); buildProfile(c); // builds the world while the cutscene plays
}
function openChapter(i) {
  const c = CH = CHAPTERS[i], S = RR.load(); $('cmsg').textContent = '';
  env = { weather:c.weather, time:c.time, legal:false, shadows:S.shadows }; document.body.dataset.legal = '0'; applyEnv(); applyShadows();
  audio.on = S.sound; $('muteBtn').textContent = S.sound ? '🔊' : '🔇'; initAudio(); if (audio.master) audio.master.gain.value = audio.on ? .5 : 0;
  T.prof = null; prep = prepare(c); prep.catch(() => {});
  const tips = [['', 'Ram ' + c.target + ' ' + HITS + ' times to take them down. Every hit gives them a big burst of speed, so line up the next one. Fall ' + c.escape + ' m behind and they are gone.']];
  if (c.id === 1) tips.push(['', 'New trick: hold ' + (document.body.dataset.touch ? 'the DRIFT button' : INP.label('hand')) + ' while steering to drift through corners. Other drivers know it too.'], ['', 'Watch out: with one hit left, each driver gets desperate and pulls out a special ability.']);
  playCut(Object.assign({}, c.scene, { cars:'chase', tcolor:c.tcolor, tstyle:c.tstyle, vega:true, lines:c.intro.concat(tips) }), async () => {
    setState('loading'); say('Building track…');
    try { await prep; startCountdown(); }
    catch (e) { CH = null; setState('chapters'); renderChapters(); $('cmsg').textContent = 'Could not build the route: ' + e.message + ' Check your connection and try again.'; }
  });
}
function startCountdown() {
  setState('countdown'); resetCar(); resetChase(); if (streamer) streamer.update(5, st.x, st.z); // bring back everything around the start line
  let n = 3; const cd = $('cd');
  const tick = () => {
    if (state !== 'countdown') return;
    if (n > 0) { cd.textContent = n--; setTimeout(tick, 1000); }
    else { cd.textContent = 'GO!'; setState('race'); setTimeout(() => { if (state === 'race') cd.textContent = ''; }, 900); }
  };
  tick();
}
function endChase(won, why) {
  if (state !== 'race') return;
  st.done = true; st.speed = 0; $('talk').style.opacity = 0; $('msg').style.display = 'none'; clearHazards();
  if (streamer && track) streamer.update(5, track.pts[5].x, track.pts[5].z); // start reloading the start line now, so Retry is instant
  if (!won) { $('fh').textContent = 'They got away'; $('ftime').textContent = why + ' ' + CH.target + ': “' + pick(CH.voice.escape) + '”'; setState('finished'); return; }
  const t = st.time, c = CH; setState('won');
  P = loadP(); P.best[c.id] = Math.min(P.best[c.id] || 1e9, t); P.unlocked = Math.max(P.unlocked, Math.min(CHAPTERS.length, c.id + 1)); if (c.id === CHAPTERS.length) P.done = true; saveP();
  const m = $('msg'); m.textContent = 'TAKEN DOWN!'; m.style.display = 'block';
  setTimeout(() => { m.style.display = 'none';
    playCut(Object.assign({}, c.scene, { cars:'caught', tcolor:c.tcolor, tstyle:c.tstyle, lines:c.outro.concat([['', 'Taken down in ' + t.toFixed(1) + ' s.']]) }),
      () => c.id === CHAPTERS.length ? playCut(FINALE, toChapters) : toChapters());
  }, 1600);
}
function finishRace() { endChase(false, 'The route ended before you could take down ' + CH.target + '.'); } // called by the engine when you reach the end
function retry() { if (track && CH && (state === 'race' || state === 'finished')) startCountdown(); }
$('retry').onclick = () => startCountdown();
$('tomenu').onclick = toChapters; $('chapBtn').onclick = e => { e.currentTarget.blur(); toChapters(); };
$('watchP').onclick = () => playCut(PROLOGUE, toChapters);
$('resetP').onclick = () => { if (confirm('Reset all story progress?')) { try { localStorage.removeItem(SKEY); } catch (e) {} toChapters(); } };

if (!P.prologue) { P.prologue = true; saveP(); playCut(PROLOGUE, toChapters); } else toChapters();
</script>
