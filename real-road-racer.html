<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real Road Racer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --ink:#f3ede4; --panel:rgba(22,28,40,.82); --accent:#f2a65a; --muted:#a9b3c4; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#1b2434; color:var(--ink);
    font:15px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif; }
  canvas { display:block; }
  #panel { position:fixed; top:12px; left:12px; width:min(340px,calc(100% - 24px)); background:var(--panel);
    border-radius:10px; padding:14px; backdrop-filter:blur(6px); }
  #panel h1 { font-size:17px; margin:0 0 10px; font-weight:700; letter-spacing:.2px; }
  label { display:block; font-size:13px; color:var(--muted); margin:8px 0 3px; }
  input[type=text], input[type=number] { width:100%; padding:7px 9px; border-radius:6px; border:1px solid #3a475e;
    background:#121926; color:var(--ink); font:inherit; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .row { display:flex; gap:8px; align-items:center; }
  .row > * { flex:1; }
  .check { display:flex; gap:7px; align-items:center; margin-top:10px; color:var(--muted); font-size:13px; }
  .check input { flex:none; }
  button { margin-top:12px; width:100%; padding:9px; border:0; border-radius:6px; background:var(--accent);
    color:#2a1c0c; font:inherit; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.55; cursor:wait; }
  #status { margin-top:10px; font-size:13px; color:var(--muted); min-height:1.4em; }
  #status.err { color:#ff9c8f; }
  #hud { position:fixed; right:14px; bottom:14px; text-align:right; text-shadow:0 1px 6px rgba(0,0,0,.6); pointer-events:none; }
  #speed { font-size:54px; font-weight:700; line-height:1; }
  #speed small { font-size:16px; font-weight:400; margin-left:4px; }
  #info { font-size:14px; color:var(--ink); }
  #help { position:fixed; left:14px; bottom:12px; font-size:12px; color:var(--muted); }
  #msg { position:fixed; top:40%; left:50%; transform:translate(-50%,-50%); font-size:30px; font-weight:700;
    text-shadow:0 2px 12px rgba(0,0,0,.7); display:none; text-align:center; }
  #panel { max-height:calc(100% - 24px); overflow:auto; }
  #map { height:170px; border-radius:6px; margin:6px 0 2px; }
  h2 { font-size:14px; margin:16px 0 2px; }
  select { width:100%; padding:7px 9px; border-radius:6px; border:1px solid #3a475e; background:#121926; color:var(--ink); font:inherit; }
  #garage button { margin:4px 0 0; background:#26324a; color:var(--ink); text-align:left; font-weight:400; padding:7px 9px; }
  #garage button.sel { outline:2px solid var(--accent); }
  #manual { display:none; margin-top:6px; }
  .card { background:var(--panel); border-radius:12px; padding:18px; width:min(380px,100%); backdrop-filter:blur(6px); }
  #menu, #loading, #countdown, #finish { display:none; position:fixed; inset:0; }
  body[data-s=menu] #menu, body[data-s=confirm] #menu { display:flex; }
  body[data-s=loading] #loading, body[data-s=countdown] #countdown, body[data-s=race] #countdown, body[data-s=finished] #finish { display:flex; }
  body[data-s=menu] #confirmPanel, body[data-s=confirm] #formPanel { display:none; }
  #menu { background:linear-gradient(160deg,#18202e,#26344d); padding:16px; gap:16px; align-items:stretch; }
  #menu #map { flex:1; height:auto; margin:0; min-height:240px; }
  #formPanel, #confirmPanel { align-self:flex-start; max-height:100%; overflow:auto; }
  @media (max-width:760px) { #menu { flex-direction:column; } #formPanel, #confirmPanel { width:100%; } }
  .row2 { display:flex; gap:8px; } .row2 input[type=text] { flex:1; min-width:0; } .row2 button { width:auto; margin:0; padding:0 12px; }
  input[type=color] { width:52px; height:38px; padding:2px; border:1px solid #3a475e; border-radius:6px; background:#121926; cursor:pointer; }
  button.alt { background:#26324a; color:var(--ink); }
  #sum div { margin:7px 0; word-break:break-word; } #sum b { color:var(--accent); }
  #loading, #countdown, #finish { align-items:center; justify-content:center; flex-direction:column; }
  #loading { background:#18202e; } #finish { background:rgba(10,14,22,.72); } #countdown { pointer-events:none; }
  .big { font-size:min(22vw,160px); font-weight:800; text-shadow:0 4px 24px rgba(0,0,0,.6); }
  #loadmsg { font-size:20px; font-weight:600; } #ftime { font-size:22px; margin:8px 0 4px; }
  #note { position:fixed; left:50%; transform:translateX(-50%); bottom:38px; font-size:12px; color:#ff9c8f; text-align:center; }
  #mini { position:fixed; top:12px; right:12px; width:220px; height:160px; border-radius:10px; box-shadow:0 2px 12px rgba(0,0,0,.4); }
  #tools { position:fixed; top:12px; left:12px; display:none; gap:8px; }
  .tool { width:auto; margin:0; padding:7px 12px; background:rgba(22,28,40,.78); color:var(--ink); font-weight:600; }
  #touch { display:none; }
  #touch button { position:fixed; bottom:18px; width:78px; height:78px; margin:0; padding:0; border-radius:50%; background:rgba(22,28,40,.6);
    color:#fff; font-size:26px; touch-action:none; user-select:none; -webkit-user-select:none; border:2px solid rgba(255,255,255,.25); }
  #touch svg { width:36px; height:36px; stroke:#fff; stroke-width:2.6; fill:none; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
  #touch [data-k=left] { left:12px; } #touch [data-k=right] { left:100px; } #touch [data-k=down] { right:100px; } #touch [data-k=up] { right:12px; }
  body[data-touch="1"] #hud { bottom:110px; } body[data-touch="1"] #help { display:none !important; }
  body[data-s=countdown] #tools, body[data-s=race] #tools, body[data-s=finished] #tools { display:flex; }
  body[data-touch="1"][data-s=countdown] #touch, body[data-touch="1"][data-s=race] #touch { display:block; }
  #limit { position:fixed; top:12px; left:50%; transform:translateX(-50%); display:none; text-align:center; pointer-events:none; }
  #limNum { width:68px; height:68px; border-radius:50%; background:#fff; border:7px solid #d62d2d; color:#111; font:800 24px/54px "Trebuchet MS",sans-serif; margin:0 auto; }
  #limit.over #limNum { animation:pulse .45s infinite alternate; } @keyframes pulse { to { background:#ffd0d0; } }
  #limWarn { margin-top:6px; color:#ff9c8f; font-weight:700; text-shadow:0 1px 6px rgba(0,0,0,.8); min-height:1.4em; }
  #toast { position:fixed; top:140px; left:50%; transform:translateX(-50%); font-size:32px; font-weight:800; color:#ff6b5e; text-shadow:0 2px 14px rgba(0,0,0,.8); display:none; pointer-events:none; white-space:nowrap; }
  body[data-legal="1"][data-s=countdown] #limit, body[data-legal="1"][data-s=race] #limit { display:block; }
  #hud, #help, #note, #mini { display:none; }
  body[data-s=countdown] :is(#hud,#help,#note,#mini), body[data-s=race] :is(#hud,#help,#note,#mini), body[data-s=finished] :is(#hud,#help,#note,#mini) { display:block; }
</style>
</head>
<body>
<div id="menu">
  <div id="formPanel" class="card">
    <h1>Real Road Racer</h1>
    <label for="a">Start (address or latitude, longitude)</label>
    <div class="row2"><input id="a" type="text" placeholder="e.g. Piazza del Duomo, Milano" autocomplete="off"><button class="alt" id="locA" title="Use my location" aria-label="Use my location as start">📍</button></div>
    <label for="b">Finish (address or latitude, longitude)</label>
    <div class="row2"><input id="b" type="text" placeholder="e.g. Castello Sforzesco, Milano" autocomplete="off"><button class="alt" id="locB" title="Use my location" aria-label="Use my location as finish">📍</button></div>
    <label for="hex">Car colour</label>
    <div class="row2"><input id="col" type="color" value="#d9482b" aria-label="Colour picker"><input id="hex" type="text" value="#d9482b" maxlength="7" aria-label="Hex colour code"></div>
    <div class="row2"><div style="flex:1"><label for="wx">Weather</label><select id="wx"><option>Clear</option><option>Cloudy</option><option>Rain</option><option>Fog</option></select></div>
    <div style="flex:1"><label for="tod">Time of day</label><select id="tod"><option>Morning</option><option selected>Day</option><option>Sunset</option><option>Night</option></select></div></div>
    <label class="check"><input id="legal" type="checkbox"> Legal mode: obey speed limits (+10 s each time you stay over for 3 s)</label>
    <button id="go">Start</button>
    <div id="status"></div>
  </div>
  <div id="confirmPanel" class="card">
    <h1>Confirm your race</h1>
    <div id="sum"></div>
    <button id="ok">Confirm and start</button>
    <button id="back" class="alt">Back</button>
  </div>
  <div id="map"></div>
</div>
<div id="loading"><div id="loadmsg">Building track…</div></div>
<div id="countdown"><div class="big" id="cd"></div></div>
<div id="finish"><div class="card"><h1>Finished!</h1><div id="ftime"></div><button id="retry">Retry</button><button id="tomenu" class="alt">Main menu</button></div></div>
<div id="note"></div>
<div id="limit"><div id="limNum">50</div><div id="limWarn"></div></div>
<div id="toast"></div>
<div id="tools"><button class="tool" id="muteBtn" title="Sound (M)" aria-label="Toggle sound">🔊</button><button class="tool" id="camBtn" title="Camera (C)">🎥 Chase</button></div>
<div id="touch"><button data-k="left" aria-label="Steer left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"/></svg></button><button data-k="right" aria-label="Steer right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button><button data-k="down" aria-label="Brake and reverse"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v15M6 13l6 6 6-6"/></svg></button><button data-k="up" aria-label="Accelerate"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V5M6 11l6-6 6 6"/></svg></button></div>
<canvas id="mini" width="220" height="160"></canvas>
<div id="hud"><div id="speed">0<small>km/h</small></div><div id="info"></div></div>
<div id="help">Arrows or WASD to drive &middot; Space handbrake &middot; C camera &middot; M sound &middot; R restart</div>
<div id="msg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const statusEl = $('status');
const say = (t, err) => { statusEl.textContent = t; statusEl.className = err ? 'err' : ''; $('loadmsg').textContent = t; };

/* ---------- Three.js scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bb3cc);
scene.fog = new THREE.Fog(0x9bb3cc, 120, 900);
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.5, 3000);
const hemi = new THREE.HemisphereLight(0xdfe9f5, 0x3b4a3a, 0.9); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe2b8, 0.8);
sun.position.set(-200, 300, 120);
scene.add(sun);
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
});

// Car classes (generic archetypes; swap in real models later)
const CLASSES = {
  hatch:  { name:'Hatchback', len:3.9, w:1.75, h:.7,  cab:.55, m:1100, P:55000,  cda:.70,  mu:1.00, df:0,      vmax:50 },
};
for (const c of Object.values(CLASSES)) { // top speed where engine power = air drag + rolling resistance
  let lo = 1, hi = 150;
  for (let i = 0; i < 40; i++) { const v = (lo + hi) / 2; if (c.P / v > .5 * 1.2 * c.cda * v * v + .012 * c.m * 9.81) lo = v; else hi = v; }
  c.top = Math.min(lo, c.vmax);
}
const car = new THREE.Group(); scene.add(car);
const head = new THREE.SpotLight(0xfff1d0, 0, 80, .55, .6, 1); // headlights
let env = { weather:'Clear', time:'Day', legal:false };
let cur = CLASSES.hatch;
function setCar(c) {
  cur = CLASSES[c.cls]; car.clear();
  const body = new THREE.Mesh(new THREE.BoxGeometry(cur.w, cur.h, cur.len), new THREE.MeshLambertMaterial({ color:c.color }));
  body.position.y = .35 + cur.h / 2;
  const cab = new THREE.Mesh(new THREE.BoxGeometry(cur.w * .82, cur.cab, cur.len * .45), new THREE.MeshLambertMaterial({ color:0x1d2633 }));
  cab.position.set(0, .35 + cur.h + cur.cab / 2, -cur.len * .05);
  car.add(body, cab);
  const wr = .33, ww = .25, tire = new THREE.MeshLambertMaterial({ color:0x15171b }), hub = new THREE.MeshLambertMaterial({ color:0xb7bcc6 });
  car.userData.wheels = []; car.userData.pivots = [];
  for (const [sx, sz] of [[-1, 1], [1, 1], [-1, -1], [1, -1]]) {
    const piv = new THREE.Group(), spin = new THREE.Group();
    piv.position.set(sx * (cur.w / 2 - .05), wr, sz * cur.len * .32);
    const t = new THREE.Mesh(new THREE.CylinderGeometry(wr, wr, ww, 18), tire); t.rotation.z = Math.PI / 2;
    const hb = new THREE.Mesh(new THREE.CylinderGeometry(wr * .55, wr * .55, ww + .02, 10), hub); hb.rotation.z = Math.PI / 2;
    const spoke = new THREE.Mesh(new THREE.BoxGeometry(ww + .04, wr * 1.5, .07), tire);
    spin.add(t, hb, spoke); piv.add(spin); car.add(piv);
    car.userData.wheels.push(spin); if (sz > 0) car.userData.pivots.push(piv);
  }
  const hl = new THREE.MeshBasicMaterial({ color:0xfff3c4 }), tl = new THREE.MeshBasicMaterial({ color:0x6b1111 }); car.userData.tail = tl;
  for (const sx of [-1, 1]) {
    const a = new THREE.Mesh(new THREE.BoxGeometry(.32, .14, .06), hl); a.position.set(sx * cur.w * .32, .35 + cur.h * .62, cur.len / 2 + .01);
    const b = new THREE.Mesh(new THREE.BoxGeometry(.34, .14, .06), tl); b.position.set(sx * cur.w * .32, .35 + cur.h * .68, -cur.len / 2 - .01);
    car.add(a, b);
  }
  head.position.set(0, .35 + cur.h * .7, cur.len / 2); head.target.position.set(0, .2, cur.len / 2 + 20); car.add(head, head.target);
}

let trackGroup = null, track = null; // track = {pts:[Vector3], n, length}

/* ---------- Geo helpers ---------- */
function parseLatLon(s) {
  const m = s.match(/(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)/);
  if (!m) throw new Error('Could not read coordinates: "' + s + '". Use the form 45.4641, 9.1919');
  return { lat:+m[1], lon:+m[2] };
}
function haversine(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r) * Math.cos(b.lat*r) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

/* ---------- Data fetching ---------- */
async function fetchRoute(a, b) {
  const url = `https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('Routing service returned ' + r.status);
  const j = await r.json();
  if (!j.routes || !j.routes.length) throw new Error('No drivable route found between those points.');
  return j.routes[0].geometry.coordinates.map(c => ({ lon:c[0], lat:c[1] }));
}
async function fetchElevation(coords) {
  // sample up to 100 evenly spaced points along the route, interpolate the rest later
  const k = Math.min(100, coords.length);
  const idx = Array.from({ length:k }, (_, i) => Math.round(i * (coords.length - 1) / (k - 1)));
  const f4 = c => c.lat.toFixed(4) + ',' + c.lon.toFixed(4);
  const ckey = 'rrElev|' + f4(coords[0]) + '|' + f4(coords[coords.length - 1]) + '|' + coords.length;
  try { const c = JSON.parse(localStorage.getItem(ckey)); if (c && c.length === k) return { idx, h:c }; } catch (e) {}
  const get = async (url) => { const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 12000);
    try { const r = await fetch(url, { signal:ctl.signal }); if (!r.ok) throw new Error('status ' + r.status); return await r.json(); } finally { clearTimeout(t); } };
  const providers = [
    async () => (await get('https://api.open-meteo.com/v1/elevation?latitude=' + idx.map(i => coords[i].lat.toFixed(5)).join(',') +
      '&longitude=' + idx.map(i => coords[i].lon.toFixed(5)).join(','))).elevation,
    async () => (await get('https://api.opentopodata.org/v1/mapzen?locations=' + idx.map(i => coords[i].lat.toFixed(5) + ',' + coords[i].lon.toFixed(5)).join('|'))).results.map(r => r.elevation)
  ];
  let last = 'no provider';
  for (const p of providers) {
    try { const h = await p();
      if (Array.isArray(h) && h.length === k && h.every(Number.isFinite)) { try { localStorage.setItem(ckey, JSON.stringify(h)); } catch (e) {} return { idx, h }; }
      last = 'bad data'; } catch (err) { last = err.name === 'AbortError' ? 'timeout' : err.message; console.warn('Elevation failed:', err); }
  }
  throw new Error(last);
}

/* ---------- Track building ---------- */
function strip(pts, frames, f0, f1, y0, y1, color, mask, vc) {
  const pos = [], ind = [], col = [];
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], n = frames[i], a = f0(i), b = f1(i);
    pos.push(p.x + n.x * a, p.y + y0, p.z + n.z * a, p.x + n.x * b, p.y + y1, p.z + n.z * b);
    if (vc) col.push(vc[i].r, vc[i].g, vc[i].b, vc[i].r, vc[i].g, vc[i].b);
    if (i < pts.length - 1 && !(mask && (mask[i] || mask[i + 1]))) { const v = i * 2; ind.push(v, v+1, v+2, v+1, v+3, v+2); }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  if (vc) g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(ind); g.computeVertexNormals();
  return new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color:vc ? 0xffffff : color, vertexColors:!!vc, side:THREE.DoubleSide }));
}

async function buildTrack(a, b, coords) {
  streamer = null;
  const width = 9, exag = 1; // defaults: fallback road width and hill exaggeration

  // Local flat projection: metres east (x) and south (z) of the start point
  const kx = 111320 * Math.cos(a.lat * Math.PI / 180), kz = 110540;
  const raw = coords.map(c => new THREE.Vector3((c.lon - a.lon) * kx, 0, -(c.lat - a.lat) * kz));

  // Elevation (optional): interpolate sampled heights along the polyline
  let heights = null, elevNote = '';
  if (true) {
    try {
      say('Fetching elevation…');
      const e = await fetchElevation(coords);
      heights = new Float32Array(coords.length);
      for (let s = 0; s < e.idx.length - 1; s++) {
        for (let i = e.idx[s]; i <= e.idx[s + 1]; i++) {
          const t = (i - e.idx[s]) / Math.max(1, e.idx[s + 1] - e.idx[s]);
          heights[i] = e.h[s] + (e.h[s + 1] - e.h[s]) * t;
        }
      }
    } catch (err) { elevNote = ' Elevation unavailable (' + err.message + '), so the track is flat.'; }
  }
  const h0 = heights ? heights[0] : 0;
  raw.forEach((p, i) => { p.y = heights ? (heights[i] - h0) * exag : 0; });

  // Smooth the jagged polyline into a spline, then sample it every ~3 m
  say('Building the track…');
  const curve = new THREE.CatmullRomCurve3(raw, false, 'centripetal');
  const length = curve.getLength();
  const n = Math.max(20, Math.round(length / 3));
  const pts = curve.getSpacedPoints(n);
  // light smoothing of heights so the road doesn't jitter
  for (let pass = 0; pass < 6; pass++)
    for (let i = 1; i < pts.length - 1; i++) pts[i].y = (pts[i-1].y + pts[i].y * 2 + pts[i+1].y) / 4;

  // Left/right normal at each sample
  const frames = pts.map((p, i) => {
    const t = pts[Math.min(i + 1, pts.length - 1)].clone().sub(pts[Math.max(i - 1, 0)]); t.y = 0; t.normalize();
    return new THREE.Vector3(-t.z, 0, t.x);
  });

  let osm = null;
  if (true) {
    try { say('Loading roads and buildings…'); osm = await fetchNearRoads(a, kx, kz, coords); }
    catch (err) { console.warn(err); say('Surroundings unavailable (' + err.message + '). Plain track instead.', true); }
  }

  // spatial grid so "nearest track point" lookups stay fast
  const G = 40, grid = new Map(), gk = (x, z) => Math.floor(x / G) + ',' + Math.floor(z / G);
  pts.forEach((p, i) => { const k = gk(p.x, p.z); if (!grid.has(k)) grid.set(k, []); grid.get(k).push(i); });
  const nearTrack = (x, z, R) => {
    let bi = -1, bd = R * R; const c = Math.ceil(R / G), cx = Math.floor(x / G), cz = Math.floor(z / G);
    for (let i = -c; i <= c; i++) for (let j = -c; j <= c; j++) for (const t of grid.get((cx + i) + ',' + (cz + j)) || []) {
      const d = (pts[t].x - x) ** 2 + (pts[t].z - z) ** 2; if (d < bd) { bd = d; bi = t; } }
    return { i:bi, d:Math.sqrt(bd) };

function applyColor(v) {
  if (!HEX.test(v)) return;
  const h = v.replace('#', '').toLowerCase();
  setCar({ cls:'hatch', color:parseInt(h, 16) }); $('col').value = '#' + h; $('hex').value = '#' + h;
}
$('col').oninput = e => applyColor(e.target.value);
$('hex').oninput = e => applyColor(e.target.value);

/* ---------- Trees, parks, water ---------- */
function addNature(osm, group, minY, pts, halfs, nearTrack, crossed, keepPt = () => true) {
  const gy = minY + .05, colors = { water:0x3a6ea5, forest:0x3f6e3c, park:0x628f4e }, bufs = { water:[], forest:[], park:[] }, trees = [];
  let seed = 12345; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const ok = (x, z) => { const h = nearTrack(x, z, 20); return !(h.i >= 0 && h.d < halfs[h.i] + 4.5) && !crossed(x, z, -2); }; // keep roads clear
  for (const p of osm.trees) if (trees.length < 4000 && keepPt(p) && nearTrack(p.x, p.z, 250).i >= 0 && ok(p.x, p.z)) trees.push(p);
  for (const a of osm.areas) {
    if (!keepPt(a.fp[0])) continue;
    try {
      const sh = new THREE.Shape(a.fp.map(p => new THREE.Vector2(p.x, -p.z)));
      for (const hole of a.holes || []) sh.holes.push(new THREE.Path(hole.map(p => new THREE.Vector2(p.x, -p.z))));
      const g = new THREE.ShapeGeometry(sh); g.rotateX(-Math.PI / 2); g.translate(0, gy + (a.kind === 'water' ? .02 : 0), 0);
      bufs[a.kind].push(g.toNonIndexed().attributes.position.array); g.dispose();
    } catch (e) { /* skip bad polygon */ }
    if (a.kind === 'water') continue;
    let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
    for (const p of a.fp) { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); z0 = Math.min(z0, p.z); z1 = Math.max(z1, p.z); }
    const sp = a.kind === 'forest' ? 9 : 24;
    if ((x1 - x0) * (z1 - z0) / (sp * sp) > 8000) continue; // skip huge areas
    for (let x = x0; x < x1; x += sp) for (let z = z0; z < z1; z += sp) {
      if (trees.length >= 4000) break;
      const p = { x:x + rnd() * sp, z:z + rnd() * sp };
      if (inPoly(p, a.fp) && !(a.holes || []).some(h => inPoly(p, h)) && nearTrack(p.x, p.z, 250).i >= 0 && ok(p.x, p.z)) trees.push(p);
    }
  }
  for (const k in bufs) {
    const n = bufs[k].reduce((sum, a) => sum + a.length, 0); if (!n) continue;
    const pos = new Float32Array(n); let o = 0; for (const a of bufs[k]) { pos.set(a, o); o += a.length; }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.computeVertexNormals();
    group.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color:colors[k], side:THREE.DoubleSide, polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2 })));
  }
  for (const w of osm.waterways) {
    if (!keepPt(w.pts[0])) continue;
    const ps = w.pts.map(p => ({ x:p.x, y:0, z:p.z })); if (ps.length < 2) continue;
    const hw = { river:12, canal:5, stream:1.5, ditch:.8 }[w.t.waterway] || 2;
    accStrip(ps, framesOf(ps), -hw, hw, gy + .03, gy + .03, colors.water);
  }
  flushAccs(group);
  if (trees.length) {
    const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(.22, .3, 1, 6), new THREE.MeshLambertMaterial({ color:0x6b4a2f }), trees.length);
    const crown = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), new THREE.MeshLambertMaterial({ color:0xffffff }), trees.length);
    const o = new THREE.Object3D(), c = new THREE.Color();
    trees.forEach((p, i) => {
      const sc = .8 + rnd() * .7, th = 2.4 * sc;
      o.position.set(p.x, minY + th / 2, p.z); o.scale.set(sc, th, sc); o.updateMatrix(); trunk.setMatrixAt(i, o.matrix);
      o.position.set(p.x, minY + th + 1.6 * sc, p.z); o.scale.set(2.1 * sc, 2.3 * sc, 2.1 * sc); o.updateMatrix(); crown.setMatrixAt(i, o.matrix);
      c.setHSL(.24 + rnd() * .08, .45, .26 + rnd() * .1); crown.setColorAt(i, c);
    });
    trunk.frustumCulled = crown.frustumCulled = false; group.add(trunk, crown);
  }
}

/* ---------- Weather + time of day ---------- */
const TIMES = {
  Morning:{ sky:0xc9d9ea, hc:0xe4edf7, gc:0x4a5a44, hi:.95, sc:0xffe3b8, si:.8,  sp:[-150, 120, 220] },
  Day:    { sky:0x9bb3cc, hc:0xdfe9f5, gc:0x3b4a3a, hi:.9,  sc:0xffe2b8, si:.8,  sp:[-200, 300, 120] },
  Sunset: { sky:0xe59a6b, hc:0xf2c9a8, gc:0x4a3a3a, hi:.7,  sc:0xff9a4d, si:.75, sp:[300, 60, -100] },
  Night:  { sky:0x070c18, hc:0x4a5a8a, gc:0x10151f, hi:.55, sc:0x8fa0d8, si:.3,  sp:[-100, 200, 100] }
};
const FOGS = { Clear:[120, 900], Cloudy:[100, 700], Rain:[40, 380], Fog:[8, 160] };
function applyEnv() {
  const T = TIMES[env.time], night = env.time === 'Night', gm = { Clear:0, Cloudy:.45, Rain:.65, Fog:.7 }[env.weather];
  const sky = new THREE.Color(T.sky).lerp(new THREE.Color(night ? 0x0a0f1a : 0x7b838f), gm);
  scene.background.copy(sky); scene.fog.color.copy(sky); scene.fog.near = FOGS[env.weather][0]; scene.fog.far = FOGS[env.weather][1];
  hemi.color.setHex(T.hc); hemi.groundColor.setHex(T.gc); hemi.intensity = T.hi * (1 - .2 * gm);
  sun.color.setHex(T.sc); sun.intensity = T.si * (1 - .6 * gm); sun.position.set(...T.sp);
  head.intensity = night ? 2.2 : (env.time === 'Sunset' || env.weather === 'Fog' || env.weather === 'Rain') ? 1.1 : 0;
  rain.visible = env.weather === 'Rain';
}
const RN = 1600, rainPos = new Float32Array(RN * 6), rainL = new Float32Array(RN * 3);
for (let i = 0; i < RN; i++) { rainL[i * 3] = (Math.random() - .5) * 44; rainL[i * 3 + 1] = Math.random() * 22 - 10; rainL[i * 3 + 2] = (Math.random() - .5) * 44; }
const rainGeo = new THREE.BufferGeometry(); rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rain = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color:0xb9c6d6, transparent:true, opacity:.45 }));
rain.frustumCulled = false; rain.visible = false; scene.add(rain);
function updateRain(dt) {
  if (!rain.visible || state === 'menu' || state === 'confirm' || state === 'loading') return;
  const vx = Math.sin(st.heading) * st.speed, vz = Math.cos(st.heading) * st.speed;
  for (let i = 0; i < RN; i++) {
    let x = rainL[i * 3] - vx * dt, y = rainL[i * 3 + 1] - 28 * dt, z = rainL[i * 3 + 2] - vz * dt;
    if (x < -22) x += 44; else if (x > 22) x -= 44;
    if (z < -22) z += 44; else if (z > 22) z -= 44;
    if (y < -10) y += 22;
    rainL[i * 3] = x; rainL[i * 3 + 1] = y; rainL[i * 3 + 2] = z;
    const o = i * 6; rainPos[o] = x; rainPos[o + 1] = y; rainPos[o + 2] = z; rainPos[o + 3] = x + vx * .03; rainPos[o + 4] = y + .8; rainPos[o + 5] = z + vz * .03;
  }
  rainGeo.attributes.position.needsUpdate = true; rain.position.copy(camera.position);
}
function showToast(m) { const e = $('toast'); e.textContent = m; e.style.display = 'block'; clearTimeout(showToast.t); showToast.t = setTimeout(() => { e.style.display = 'none'; }, 2200); }

/* ---------- Sound (generated in the browser) ---------- */
const audio = { ctx:null, on:true };
function initAudio() {
  if (audio.ctx) { audio.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const c = audio.ctx = new AC(), master = audio.master = c.createGain();
  master.gain.value = audio.on ? .5 : 0; master.connect(c.destination);
  audio.f = c.createBiquadFilter(); audio.f.type = 'lowpass'; audio.f.frequency.value = 900;
  audio.eg = c.createGain(); audio.eg.gain.value = 0;
  audio.o1 = c.createOscillator(); audio.o2 = c.createOscillator(); audio.o1.type = 'sawtooth'; audio.o2.type = 'square';
  audio.o1.connect(audio.f); audio.o2.connect(audio.f); audio.f.connect(audio.eg); audio.eg.connect(master); audio.o1.start(); audio.o2.start();
  const nb = audio.nb = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const noise = (type, freq, q) => { const src = c.createBufferSource(); src.buffer = nb; src.loop = true;
    const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = freq; fl.Q.value = q;
    const g = c.createGain(); g.gain.value = 0; src.connect(fl); fl.connect(g); g.connect(master); src.start(); return g; };
  audio.squeal = noise('bandpass', 1800, 6); audio.rough = noise('lowpass', 600, .6); audio.rain = noise('highpass', 2500, .4);
}
function thud(p) {
  const c = audio.ctx; if (!c || !audio.on) return; const t = c.currentTime;
  const o = c.createOscillator(), g = c.createGain(); o.type = 'sine';
  o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(35, t + .25);
  g.gain.setValueAtTime(.7 * p, t); g.gain.exponentialRampToValueAtTime(.001, t + .3);
  o.connect(g); g.connect(audio.master); o.start(t); o.stop(t + .32);
  const s2 = c.createBufferSource(), gg = c.createGain(); s2.buffer = audio.nb;
  gg.gain.setValueAtTime(.4 * p, t); gg.gain.exponentialRampToValueAtTime(.001, t + .15);
  s2.connect(gg); gg.connect(audio.master); s2.start(t, 0, .2);
}
function updateAudio() {
  const c = audio.ctx; if (!c) return;
  const t = c.currentTime, racing = state === 'race', live = racing || state === 'countdown';
  const v = racing ? Math.abs(st.speed) : 0, lim = [12, 22, 33, 50]; // simple 4-speed gearbox sets the revs
  let g = 0; while (g < 3 && v > lim[g]) g++;
  const lo = g ? lim[g - 1] * .6 : 0, rpm = 900 + 5600 * Math.min(1, Math.max(0, (v - lo) / (lim[g] - lo)));
  const thr = racing && (keys.ArrowUp || keys.KeyW || touch.up || pad.up > .08) ? 1 : 0;
  audio.o1.frequency.setTargetAtTime(rpm / 30, t, .04); audio.o2.frequency.setTargetAtTime(rpm / 60, t, .04);
  audio.f.frequency.setTargetAtTime(350 + rpm * .3 + thr * 500, t, .08);
  audio.eg.gain.setTargetAtTime(live ? .07 + .08 * thr + .05 * rpm / 6500 : 0, t, .06);
  audio.squeal.gain.setTargetAtTime(racing && st.slip && v > 8 ? Math.min(.2, .04 + v * .003) : 0, t, .05);
  audio.rough.gain.setTargetAtTime(racing && st.rough && v > 2 ? Math.min(.35, v * .012) : 0, t, .08);
  audio.rain.gain.setTargetAtTime(live && env.weather === 'Rain' ? .07 : 0, t, .3);
  if (racing && st.bump > 4) thud(Math.min(1, st.bump / 25));
  st.bump = 0;
}
function toggleMute() { audio.on = !audio.on; if (audio.master) audio.master.gain.value = audio.on ? .5 : 0; $('muteBtn').textContent = audio.on ? '🔊' : '🔇'; }
$('muteBtn').onclick = e => { toggleMute(); e.currentTarget.blur(); };

/* ---------- Cameras ---------- */
const CAMS = ['Chase', 'Far', 'Hood', 'Reverse']; let camMode = 0;
function setCam(m) {
  camMode = m % CAMS.length; $('camBtn').textContent = '🎥 ' + CAMS[camMode];
  camera.fov = camMode === 2 ? 78 : camMode === 3 ? 70 : 65; camera.updateProjectionMatrix(); car.visible = camMode < 2; // hide the car in hood and reverse views
}
$('camBtn').onclick = e => { setCam(camMode + 1); e.currentTarget.blur(); };

/* ---------- Gamepad + touch ---------- */
const pad = { up:0, down:0, steer:0, hand:0 }, touch = { up:false, down:false, left:false, right:false }, prevBtn = {};
function pollPad() {
  const gp = (navigator.getGamepads ? [...navigator.getGamepads()] : []).find(g => g && g.connected);
  if (!gp) { pad.up = pad.down = pad.steer = pad.hand = 0; return; }
  const btn = i => gp.buttons[i] ? gp.buttons[i].value : 0, dz = x => Math.abs(x) < .12 ? 0 : x;
  pad.steer = dz(gp.axes[0] || 0); pad.up = btn(7); pad.down = btn(6); pad.hand = btn(2) > .5 ? 1 : 0; // stick, triggers, X button
  const edge = (i, fn) => { const p = btn(i) > .5; if (p && !prevBtn[i]) fn(); prevBtn[i] = p; };
  edge(3, () => setCam(camMode + 1)); edge(9, () => retry()); edge(0, toggleMute);       // Y camera, Start retry, A sound
}
if (matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window) document.body.dataset.touch = '1';
document.querySelectorAll('#touch button').forEach(b => { const k = b.dataset.k;
  const on = e => { e.preventDefault(); touch[k] = true; }, off = e => { e.preventDefault(); touch[k] = false; };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off); });

/* ---------- Menu flow ---------- */
let state = 'menu', pending = null, routeLine = null;
const setState = v => { state = v; document.body.dataset.s = v; if (v === 'menu' || v === 'confirm') setTimeout(() => map.invalidateSize(), 50); };
setState('menu');

async function resolvePlace(text) { // "lat, lon" or an address
  text = text.trim(); if (!text) throw new Error('Enter a start and a finish.');
  const m = text.match(/^(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)$/);
  if (m) return { lat:+m[1], lon:+m[2], label:text };
  const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=' + encodeURIComponent(text));
  if (!r.ok) throw new Error('Address search failed (status ' + r.status + ').');
  const j = await r.json(); if (!j.length) throw new Error('Could not find "' + text + '".');
  return { lat:+j[0].lat, lon:+j[0].lon, label:j[0].display_name };
}
function locate(id) {
  if (!navigator.geolocation) return say('Your browser can\'t share a location here.', true);
  say('Waiting for location permission…');
  navigator.geolocation.getCurrentPosition(p => {
    $(id).value = p.coords.latitude.toFixed(5) + ', ' + p.coords.longitude.toFixed(5);
    map.setView([p.coords.latitude, p.coords.longitude], 15); say('');
  }, e => say(e.code === 1 ? 'Location permission was denied.' : 'Could not get your location.', true), { enableHighAccuracy:true, timeout:15000 });
}
$('locA').onclick = () => locate('a'); $('locB').onclick = () => locate('b');

$('go').onclick = async () => {
  $('go').disabled = true; say('Looking up places…');
  try {
    const a = await resolvePlace($('a').value), b = await resolvePlace($('b').value);
    say('Finding the route…');
    const coords = await fetchRoute(a, b);
    let len = 0; for (let i = 1; i < coords.length; i++) len += haversine(coords[i - 1], coords[i]);
    if (len > 15000) throw new Error('That route is ' + (len / 1000).toFixed(1) + ' km. The maximum is 15 km.');
    pending = { a, b, coords };
    if (routeLine) routeLine.remove();
    routeLine = L.polyline(coords.map(c => [c.lat, c.lon]), { color:'#f2a65a', weight:5 }).addTo(map);
    map.fitBounds(routeLine.getBounds(), { padding:[30, 30] });
    const row = (k, v) => { const d = document.createElement('div'), t = document.createElement('b'); t.textContent = k + ': '; d.append(t, v); return d; };
    $('sum').replaceChildren(row('Start', a.label), row('Finish', b.label), row('Route', (len / 1000).toFixed(2) + ' km'), row('Conditions', $('wx').value + ', ' + $('tod').value.toLowerCase()), row('Legal mode', $('legal').checked ? 'On: speed limits apply' : 'Off'));
    say(''); setState('confirm');
  } catch (e) { say(e.message, true); }
  $('go').disabled = false;
};
$('back').onclick = () => setState('menu');
$('ok').onclick = async () => {
  env = { weather:$('wx').value, time:$('tod').value, legal:$('legal').checked }; document.body.dataset.legal = env.legal ? '1' : '0'; applyEnv();
  initAudio(); setState('loading'); say('Building track…');
  try { await buildTrack(pending.a, pending.b, pending.coords); startCountdown(); }
  catch (e) { setState('menu'); say(e.message, true); }
};

function startCountdown() {
  setState('countdown'); resetCar();
  let n = 3; const cd = $('cd');
  const tick = () => {
    if (state !== 'countdown') return;
    if (n > 0) { cd.textContent = n--; setTimeout(tick, 1000); }
    else { cd.textContent = 'GO!'; setState('race'); setTimeout(() => { if (state === 'race') cd.textContent = ''; }, 900); }
  };
  tick();
}
function finishRace() {
  setState('finished');
  const L = (k, v) => { const d = document.createElement('div'); d.textContent = k + v; return d; };
  const rows = [L('Race time: ', st.time.toFixed(1) + ' s')];
  if (env.legal) rows.push(L('Penalties: ', st.pen / 10 + ' \u00d7 10 s = ' + st.pen + ' s'), L('Final time: ', (st.time + st.pen).toFixed(1) + ' s'));
  $('ftime').replaceChildren(...rows);
}
function retry() { if (track && (state === 'race' || state === 'finished')) startCountdown(); }
$('retry').onclick = () => startCountdown();
$('tomenu').onclick = () => setState('menu');
</script>
