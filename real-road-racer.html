<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real Road Racer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --ink:#f3ede4; --panel:rgba(22,28,40,.82); --accent:#f2a65a; --muted:#a9b3c4; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#1b2434; color:var(--ink);
    font:15px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif; }
  canvas { display:block; }
  #panel { position:fixed; top:12px; left:12px; width:min(340px,calc(100% - 24px)); background:var(--panel);
    border-radius:10px; padding:14px; backdrop-filter:blur(6px); }
  #panel h1 { font-size:17px; margin:0 0 10px; font-weight:700; letter-spacing:.2px; }
  label { display:block; font-size:13px; color:var(--muted); margin:8px 0 3px; }
  input[type=text], input[type=number] { width:100%; padding:7px 9px; border-radius:6px; border:1px solid #3a475e;
    background:#121926; color:var(--ink); font:inherit; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .row { display:flex; gap:8px; align-items:center; }
  .row > * { flex:1; }
  .check { display:flex; gap:7px; align-items:center; margin-top:10px; color:var(--muted); font-size:13px; }
  .check input { flex:none; }
  button { margin-top:12px; width:100%; padding:9px; border:0; border-radius:6px; background:var(--accent);
    color:#2a1c0c; font:inherit; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.55; cursor:wait; }
  #status { margin-top:10px; font-size:13px; color:var(--muted); min-height:1.4em; }
  #status.err { color:#ff9c8f; }
  #hud { position:fixed; right:14px; bottom:14px; text-align:right; text-shadow:0 1px 6px rgba(0,0,0,.6); pointer-events:none; }
  #speed { font-size:54px; font-weight:700; line-height:1; }
  #speed small { font-size:16px; font-weight:400; margin-left:4px; }
  #info { font-size:14px; color:var(--ink); }
  #help { position:fixed; left:14px; bottom:12px; font-size:12px; color:var(--muted); }
  #msg { position:fixed; top:40%; left:50%; transform:translate(-50%,-50%); font-size:30px; font-weight:700;
    text-shadow:0 2px 12px rgba(0,0,0,.7); display:none; text-align:center; }
  #panel { max-height:calc(100% - 24px); overflow:auto; }
  #map { height:170px; border-radius:6px; margin:6px 0 2px; }
  h2 { font-size:14px; margin:16px 0 2px; }
  select { width:100%; padding:7px 9px; border-radius:6px; border:1px solid #3a475e; background:#121926; color:var(--ink); font:inherit; }
  #garage button { margin:4px 0 0; background:#26324a; color:var(--ink); text-align:left; font-weight:400; padding:7px 9px; }
  #garage button.sel { outline:2px solid var(--accent); }
  #manual { display:none; margin-top:6px; }
</style>
</head>
<body>
<div id="panel">
  <h1>Real Road Racer</h1>
  <div id="map"></div>
  <label for="a">Start (latitude, longitude)</label>
  <input id="a" type="text" value="45.4641, 9.1919">
  <label for="b">End (latitude, longitude)</label>
  <input id="b" type="text" value="45.4705, 9.1795">
  <div class="row">
    <div><label for="w">Fallback width (m)</label><input id="w" type="number" value="9" min="4" max="20"></div>
    <div><label for="ex">Hill exaggeration</label><input id="ex" type="number" value="1" min="0" max="5" step="0.5"></div>
  </div>
  <div class="check"><input id="elev" type="checkbox" checked><label for="elev" style="margin:0">Use real elevation</label></div>
  <div class="check"><input id="bld" type="checkbox" checked><label for="bld" style="margin:0">Load real roads &amp; buildings (OpenStreetMap)</label></div>
  <button id="go">Build track</button>
  <div id="status">Click the map to set the start, click again for the end. Then build the track.</div>
  <h2>Car</h2>
  <div id="garage"></div>

</div>
<div id="hud"><div id="speed">0<small>km/h</small></div><div id="info"></div></div>
<div id="help">Arrows or WASD to drive &middot; Space to brake &middot; R to restart</div>
<div id="msg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const statusEl = $('status');
const say = (t, err) => { statusEl.textContent = t; statusEl.className = err ? 'err' : ''; };

/* ---------- Three.js scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bb3cc);
scene.fog = new THREE.Fog(0x9bb3cc, 120, 900);
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.5, 3000);
scene.add(new THREE.HemisphereLight(0xdfe9f5, 0x3b4a3a, 0.9));
const sun = new THREE.DirectionalLight(0xffe2b8, 0.8);
sun.position.set(-200, 300, 120);
scene.add(sun);
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
});

// Car classes (generic archetypes; swap in real models later)
const CLASSES = {
  hatch:  { name:'Hatchback', len:3.9, w:1.75, h:.7,  cab:.55, top:42, acc:14, grip:1.0 },
  sedan:  { name:'Sedan',     len:4.7, w:1.85, h:.7,  cab:.55, top:47, acc:15, grip:.95 },
  suv:    { name:'SUV',       len:4.6, w:1.95, h:1.0, cab:.7,  top:40, acc:12, grip:.85 },
  sports: { name:'Sports',    len:4.4, w:1.9,  h:.55, cab:.45, top:56, acc:19, grip:1.1 },
  super:  { name:'Supercar',  len:4.5, w:2.0,  h:.5,  cab:.4,  top:66, acc:24, grip:1.2 }
};
const car = new THREE.Group(); scene.add(car);
let cur = CLASSES.hatch;
function setCar(c) {
  cur = CLASSES[c.cls]; car.clear();
  const body = new THREE.Mesh(new THREE.BoxGeometry(cur.w, cur.h, cur.len), new THREE.MeshLambertMaterial({ color:c.color }));
  body.position.y = .35 + cur.h / 2;
  const cab = new THREE.Mesh(new THREE.BoxGeometry(cur.w * .82, cur.cab, cur.len * .45), new THREE.MeshLambertMaterial({ color:0x1d2633 }));
  cab.position.set(0, .35 + cur.h + cur.cab / 2, -cur.len * .05);
  car.add(body, cab);
}

let trackGroup = null, track = null; // track = {pts:[Vector3], n, length}

/* ---------- Geo helpers ---------- */
function parseLatLon(s) {
  const m = s.match(/(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)/);
  if (!m) throw new Error('Could not read coordinates: "' + s + '". Use the form 45.4641, 9.1919');
  return { lat:+m[1], lon:+m[2] };
}
function haversine(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r) * Math.cos(b.lat*r) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

/* ---------- Data fetching ---------- */
async function fetchRoute(a, b) {
  const url = `https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('Routing service returned ' + r.status);
  const j = await r.json();
  if (!j.routes || !j.routes.length) throw new Error('No drivable route found between those points.');
  return j.routes[0].geometry.coordinates.map(c => ({ lon:c[0], lat:c[1] }));
}
async function fetchElevation(coords) {
  // sample up to 100 evenly spaced points along the route, interpolate the rest later
  const k = Math.min(100, coords.length);
  const idx = Array.from({ length:k }, (_, i) => Math.round(i * (coords.length - 1) / (k - 1)));
  const lat = idx.map(i => coords[i].lat.toFixed(5)).join(',');
  const lon = idx.map(i => coords[i].lon.toFixed(5)).join(',');
  const r = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lat}&longitude=${lon}`);
  if (!r.ok) throw new Error('Elevation service returned ' + r.status);
  const j = await r.json();
  return { idx, h:j.elevation };
}

/* ---------- Track building ---------- */
function strip(pts, frames, f0, f1, y0, y1, color, mask, vc) {
  const pos = [], ind = [], col = [];
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], n = frames[i], a = f0(i), b = f1(i);
    pos.push(p.x + n.x * a, p.y + y0, p.z + n.z * a, p.x + n.x * b, p.y + y1, p.z + n.z * b);
    if (vc) col.push(vc[i].r, vc[i].g, vc[i].b, vc[i].r, vc[i].g, vc[i].b);
    if (i < pts.length - 1 && !(mask && (mask[i] || mask[i + 1]))) { const v = i * 2; ind.push(v, v+1, v+2, v+1, v+3, v+2); }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  if (vc) g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(ind); g.computeVertexNormals();
  return new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color:vc ? 0xffffff : color, vertexColors:!!vc, side:THREE.DoubleSide }));
}

async function buildTrack() {
  const a = parseLatLon($('a').value), b = parseLatLon($('b').value);
  const width = Math.max(4, +$('w').value || 9), exag = +$('ex').value;
  if (haversine(a, b) > 15000) throw new Error('Points are over 15 km apart. Pick a shorter stretch for this prototype.');

  say('Finding the road…');
  const coords = await fetchRoute(a, b);

  // Local flat projection: metres east (x) and south (z) of the start point
  const kx = 111320 * Math.cos(a.lat * Math.PI / 180), kz = 110540;
  const raw = coords.map(c => new THREE.Vector3((c.lon - a.lon) * kx, 0, -(c.lat - a.lat) * kz));

  // Elevation (optional): interpolate sampled heights along the polyline
  let heights = null;
  if ($('elev').checked) {
    try {
      say('Fetching elevation…');
      const e = await fetchElevation(coords);
      heights = new Float32Array(coords.length);
      for (let s = 0; s < e.idx.length - 1; s++) {
        for (let i = e.idx[s]; i <= e.idx[s + 1]; i++) {
          const t = (i - e.idx[s]) / Math.max(1, e.idx[s + 1] - e.idx[s]);
          heights[i] = e.h[s] + (e.h[s + 1] - e.h[s]) * t;
        }
      }
    } catch (err) { say('Elevation unavailable, using a flat track. (' + err.message + ')'); }
  }
  const h0 = heights ? heights[0] : 0;
  raw.forEach((p, i) => { p.y = heights ? (heights[i] - h0) * exag : 0; });

  // Smooth the jagged polyline into a spline, then sample it every ~3 m
  say('Building the track…');
  const curve = new THREE.CatmullRomCurve3(raw, false, 'centripetal');
  const length = curve.getLength();
  const n = Math.max(20, Math.round(length / 3));
  const pts = curve.getSpacedPoints(n);
  // light smoothing of heights so the road doesn't jitter
  for (let pass = 0; pass < 6; pass++)
    for (let i = 1; i < pts.length - 1; i++) pts[i].y = (pts[i-1].y + pts[i].y * 2 + pts[i+1].y) / 4;

  // Left/right normal at each sample
  const frames = pts.map((p, i) => {
    const t = pts[Math.min(i + 1, pts.length - 1)].clone().sub(pts[Math.max(i - 1, 0)]); t.y = 0; t.normalize();
    return new THREE.Vector3(-t.z, 0, t.x);
  });

  let osm = null;
  if ($('bld').checked) {
    try { say('Loading roads and buildings…'); osm = await fetchOSM(a, kx, kz, coords); }
    catch (err) { console.warn(err); say('Surroundings unavailable (' + err.message + '). Plain track instead.', true); }
  }

  // spatial grid so "nearest track point" lookups stay fast
  const G = 40, grid = new Map(), gk = (x, z) => Math.floor(x / G) + ',' + Math.floor(z / G);
  pts.forEach((p, i) => { const k = gk(p.x, p.z); if (!grid.has(k)) grid.set(k, []); grid.get(k).push(i); });
  const nearTrack = (x, z, R) => {
    let bi = -1, bd = R * R; const c = Math.ceil(R / G), cx = Math.floor(x / G), cz = Math.floor(z / G);
    for (let i = -c; i <= c; i++) for (let j = -c; j <= c; j++) for (const t of grid.get((cx + i) + ',' + (cz + j)) || []) {
      const d = (pts[t].x - x) ** 2 + (pts[t].z - z) ** 2; if (d < bd) { bd = d; bi = t; } }
    return { i:bi, d:Math.sqrt(bd) };
  };

  // Race road: width and surface from the nearest real OSM road
  const halfs = new Float32Array(pts.length).fill(width / 2), cols = pts.map(() => new THREE.Color(0x3a3f48));
  if (osm) {
    osm.roads.forEach(r => { r.dp = densify(r.pts); });
    const best = new Array(pts.length).fill(null);
    for (const r of osm.roads) for (const p of r.dp) {
      const h = nearTrack(p.x, p.z, 8); if (h.i < 0) continue;
      const w = wOf(r.t), c = best[h.i];
      if (!c || h.d < c.d - 2 || (h.d < c.d + 2 && w > c.w)) best[h.i] = { d:h.d, t:r.t, w };
    }
    let last = null;
    for (let i = 0; i < pts.length; i++) { if (best[i]) last = best[i]; else if (last) best[i] = last; }
    last = null;
    for (let i = pts.length - 1; i >= 0; i--) { if (best[i]) last = best[i]; else if (last) best[i] = last; }
    best.forEach((b, i) => { if (b) { halfs[i] = wOf(b.t) / 2; cols[i].setHex(surfOf(b.t)); } });
    for (let pass = 0; pass < 8; pass++) for (let i = 1; i < pts.length - 1; i++) halfs[i] = (halfs[i-1] + halfs[i] * 2 + halfs[i+1]) / 4;
  }

  // Side roads: draw everything outside the race corridor; cut ends become blocked junctions
  const gap = [new Uint8Array(pts.length), new Uint8Array(pts.length)], runs = [];
  if (osm) for (const r of osm.roads) {
    let cur = null, prevNear = false;
    for (const p of r.dp) {
      const h = nearTrack(p.x, p.z, 220);
      if (h.i < 0) { if (cur) { runs.push(cur); cur = null; } prevNear = false; continue; }
      if (h.d < halfs[h.i] + .3) { if (cur) { cur.endCut = true; runs.push(cur); cur = null; } prevNear = true; continue; }
      if (!cur) cur = { t:r.t, p:[], startCut:prevNear, endCut:false };
      cur.p.push({ x:p.x, y:pts[h.i].y, z:p.z }); prevNear = false;
    }
    if (cur) runs.push(cur);
  }
  const ext = (a, b) => { const l = Math.hypot(a.x - b.x, a.z - b.z) || 1; return { x:a.x + (a.x - b.x) / l * 10, y:a.y, z:a.z + (a.z - b.z) / l * 10 }; };
  const blocks = [];
  for (const r of runs) {
    r.bs = 0; r.be = r.p.length;
    if (r.p.length < 5) continue;
    const w = wOf(r.t) / 2;
    if (r.startCut) r.p.unshift(ext(r.p[0], r.p[2]));
    if (r.endCut) r.p.push(ext(r.p[r.p.length - 1], r.p[r.p.length - 3]));
    r.bs = r.startCut ? 1 : 0; r.be = r.endCut ? r.p.length - 1 : r.p.length;
    if (r.startCut) blocks.push({ q:r.p[r.bs], n:r.p[r.bs + 2], w });
    if (r.endCut) blocks.push({ q:r.p[r.be - 1], n:r.p[r.be - 3], w });
  }
  for (const b of blocks) { // open the race-road edge where the side road joins
    const h = nearTrack(b.q.x, b.q.z, 40); if (h.i < 0) continue;
    const nrm = frames[h.i], side = ((b.q.x - pts[h.i].x) * nrm.x + (b.q.z - pts[h.i].z) * nrm.z) > 0 ? 1 : 0;
    const k = Math.ceil((b.w + 2) / 3);
    for (let i = Math.max(0, h.i - k); i <= Math.min(pts.length - 1, h.i + k); i++) gap[side][i] = 1;
  }

  // ---- build the scene objects
  if (trackGroup) { scene.remove(trackGroup); trackGroup.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
  trackGroup = new THREE.Group();
  const L = i => -halfs[i], R = i => halfs[i];
  trackGroup.add(strip(pts, frames, L, R, 0, 0, 0, null, cols));
  trackGroup.add(strip(pts, frames, i => -halfs[i] + .25, i => -halfs[i] + .55, .03, .03, 0xf3ede4, gap[0]));
  trackGroup.add(strip(pts, frames, i => halfs[i] - .55, i => halfs[i] - .25, .03, .03, 0xf3ede4, gap[1]));
  trackGroup.add(strip(pts, frames, i => -halfs[i] - 1.2, L, -.02, -.02, 0x6a5f55, gap[0]));
  trackGroup.add(strip(pts, frames, R, i => halfs[i] + 1.2, -.02, -.02, 0x6a5f55, gap[1]));
  trackGroup.add(strip(pts, frames, i => -halfs[i] - 1.2, i => -halfs[i] - 1.2, 0, .9, 0xd0d3d8, gap[0]));
  trackGroup.add(strip(pts, frames, i => halfs[i] + 1.2, i => halfs[i] + 1.2, 0, .9, 0xd0d3d8, gap[1]));
  for (const r of runs) {
    const w = wOf(r.t) / 2, sp = r.p.slice(r.bs, r.be);
    accStrip(r.p, framesOf(r.p), -w, w, -.01, -.01, surfOf(r.t));
    if (sp.length < 2) continue;
    const fr = framesOf(sp);
    accStrip(sp, fr, -w + .25, -w + .55, .02, .02, 0xf3ede4); accStrip(sp, fr, w - .55, w - .25, .02, .02, 0xf3ede4);
    accStrip(sp, fr, -w - 1.2, -w, -.03, -.03, 0x6a5f55); accStrip(sp, fr, w, w + 1.2, -.03, -.03, 0x6a5f55);
    accStrip(sp, fr, -w - 1.2, -w - 1.2, 0, .9, 0xd0d3d8); accStrip(sp, fr, w + 1.2, w + 1.2, 0, .9, 0xd0d3d8);
  }
  flushAccs(trackGroup);
  const xMat = new THREE.MeshBasicMaterial({ map:xTex, side:THREE.DoubleSide });
  for (const b of blocks) { // barrier + yellow X, as wide as the side road including its borders
    const ry = Math.atan2(b.n.x - b.q.x, b.n.z - b.q.z);
    const bar = new THREE.Mesh(new THREE.BoxGeometry(b.w * 2 + 2.4, .9, .6), new THREE.MeshLambertMaterial({ color:0xd0d3d8 }));
    bar.position.set(b.q.x, b.q.y + .45, b.q.z); bar.rotation.y = ry;
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 1.7), xMat);
    sign.position.set(b.q.x, b.q.y + 1.75, b.q.z); sign.rotation.y = ry;
    trackGroup.add(bar, sign);
  }
  const minY = Math.min(...pts.map(p => p.y)) - 1;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), new THREE.MeshLambertMaterial({ color:0x4c5e45 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = minY;
  trackGroup.add(ground);

  let nb = 0;
  if (osm) {
    const mats = [0xb7a99a, 0xa89d8f, 0xc4b6a3].map(c => new THREE.MeshLambertMaterial({ color:c, side:THREE.DoubleSide }));
    for (const b of osm.buildings.slice(0, 1500)) {
      let ok = true, by = 0, dm = 1e9;
      for (const f of b.fp) {
        const h = nearTrack(f.x, f.z, 150);
        if (h.i < 0 || h.d < halfs[h.i] + 3) { ok = false; break; }
        if (h.d < dm) { dm = h.d; by = pts[h.i].y; }
      }
      if (!ok) continue;
      const t = b.t, hgt = parseFloat(t.height) || (+t['building:levels'] || 0) * 3.2 || 8 + Math.abs(Math.round(b.fp[0].x + b.fp[0].z)) % 6 * 2;
      try {
        const sh = new THREE.Shape(b.fp.map(p => new THREE.Vector2(p.x, -p.z)));
        const m = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth:hgt + (by - minY), bevelEnabled:false }), mats[nb % 3]);
        m.rotation.x = -Math.PI / 2; m.position.y = minY; trackGroup.add(m); nb++;
      } catch (err) { /* skip bad footprint */ }
    }
  }
  scene.add(trackGroup);
  track = { pts, n: pts.length, length, halfs, frames, gap };
  resetCar();
  say(`Track ready: ${(length / 1000).toFixed(2)} km` + (osm ? `, ${runs.length} side roads (${blocks.length} blocked), ${nb} buildings.` : '.') + ' Drive!');
}

/* ---------- Driving ---------- */
const keys = {};
addEventListener('keydown', e => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  keys[e.code] = true;
  if (e.code === 'KeyR') resetCar();
  if (e.code === 'Space' && e.target === document.body) e.preventDefault();
});
addEventListener('keyup', e => keys[e.code] = false);

const st = { x:0, z:0, heading:0, speed:0, idx:0, time:0, done:false };
function resetCar() {
  if (!track) return;
  const p = track.pts[0], q = track.pts[3];
  st.x = p.x; st.z = p.z; st.heading = Math.atan2(q.x - p.x, q.z - p.z);
  st.speed = 0; st.idx = 0; st.time = 0; st.done = false;
  $('msg').style.display = 'none';
}

function step(dt) {
  if (!track || st.done) return;
  const up = keys.ArrowUp || keys.KeyW, down = keys.ArrowDown || keys.KeyS;
  const left = keys.ArrowLeft || keys.KeyA, right = keys.ArrowRight || keys.KeyD;

  // Find nearest centerline sample (search a window around the last one)
  let best = st.idx, bd = Infinity;
  for (let i = Math.max(0, st.idx - 25); i < Math.min(track.n, st.idx + 40); i++) {
    const p = track.pts[i], d = (p.x - st.x) ** 2 + (p.z - st.z) ** 2;
    if (d < bd) { bd = d; best = i; }
  }
  st.idx = best;
  // Barrier collision: clamp to the wall and scrub speed
  const bp = track.pts[best], bn = track.frames[best], hh = track.halfs[best];
  let d = (st.x - bp.x) * bn.x + (st.z - bp.z) * bn.z;
  const lim = hh + (track.gap[d > 0 ? 1 : 0][best] ? 1.6 : .2);
  if (Math.abs(d) > lim) {
    const over = d - Math.sign(d) * lim; st.x -= bn.x * over; st.z -= bn.z * over;
    st.speed *= 1 - Math.min(1, 2.5 * dt); d = Math.sign(d) * lim;
  }
  const offRoad = Math.abs(d) > hh;

  const topSpeed = offRoad ? 12 : cur.top;
  if (up) st.speed += cur.acc * dt;
  if (down) st.speed -= 22 * dt;
  if (keys.Space) st.speed -= 30 * dt;
  st.speed -= st.speed * (offRoad ? 1.6 : 0.12) * dt;           // drag
  st.speed = Math.max(-8, Math.min(topSpeed, st.speed));

  const steer = (left ? 1 : 0) - (right ? 1 : 0);
  const grip = Math.min(1, Math.abs(st.speed) / 6);
  st.heading += steer * 1.9 * cur.grip * grip * dt * Math.sign(st.speed || 1) * (1 - Math.min(.55, Math.abs(st.speed) / 110));
  st.x += Math.sin(st.heading) * st.speed * dt;
  st.z += Math.cos(st.heading) * st.speed * dt;
  st.time += dt;

  if (st.idx >= track.n - 3) {
    st.done = true;
    $('msg').innerHTML = `Finished in ${st.time.toFixed(1)} s<br><small style="font-size:16px;font-weight:400">Press R to go again</small>`;
    $('msg').style.display = 'block';
  }
}

const camPos = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - (frame.last || now)) / 1000); frame.last = now;
  step(dt);
  if (track) {
    const y = track.pts[st.idx].y;
    car.position.set(st.x, y, st.z); car.rotation.y = st.heading;
    const tp = new THREE.Vector3(st.x - Math.sin(st.heading) * 9, y + 4.2, st.z - Math.cos(st.heading) * 9);
    camPos.lerp(tp, 1 - Math.pow(0.001, dt));
    camera.position.copy(camPos);
    camera.lookAt(st.x + Math.sin(st.heading) * 6, y + 1.2, st.z + Math.cos(st.heading) * 6);
    $('speed').firstChild.nodeValue = Math.round(Math.abs(st.speed) * 3.6);
    $('info').textContent = `${Math.round(st.idx / (track.n - 1) * 100)}%  ·  ${st.time.toFixed(1)} s`;
  } else {
    camera.position.set(0, 30, 60); camera.lookAt(0, 0, 0);
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

/* ---------- Real roads & buildings (Overpass) ---------- */
const DEFW = { motorway:14, motorway_link:7, trunk:11, trunk_link:7, primary:9, primary_link:6, secondary:8, secondary_link:6,
  tertiary:7, tertiary_link:5, unclassified:6, residential:6, living_street:5, service:4, road:6 };
const wOf = t => { const w = parseFloat(t.width); if (w > 0) return Math.min(w, 30);
  const l = parseInt(t.lanes); if (l > 0) return Math.min(l * 3.2, 30); return DEFW[t.highway] || 6; };
const surfOf = t => { const v = t.surface || '';
  if (/cobble|sett|paving|brick/.test(v)) return 0x7d6a58;
  if (/gravel|dirt|ground|unpaved|compacted|sand|earth|grass/.test(v)) return 0x9b8660;
  if (/concrete/.test(v)) return 0x9a9da3; return 0x3a3f48; };
const densify = ps => { const o = [ps[0]];
  for (let i = 1; i < ps.length; i++) { const a = ps[i-1], b = ps[i], n = Math.ceil(Math.hypot(b.x - a.x, b.z - a.z) / 4);
    for (let k = 1; k <= n; k++) o.push({ x:a.x + (b.x - a.x) * k / n, z:a.z + (b.z - a.z) * k / n }); }
  return o; };
const accs = {};
function accStrip(ps, fr, a, b, y0, y1, hex) {
  const key = hex + '|' + y0 + '|' + y1, A = accs[key] || (accs[key] = { pos:[], ind:[], hex }), base = A.pos.length / 3;
  ps.forEach((p, i) => { const n = fr[i];
    A.pos.push(p.x + n.x * a, p.y + y0, p.z + n.z * a, p.x + n.x * b, p.y + y1, p.z + n.z * b);
    if (i < ps.length - 1) { const v = base + i * 2; A.ind.push(v, v + 1, v + 2, v + 1, v + 3, v + 2); } });
}
function flushAccs(group) {
  for (const k in accs) { const A = accs[k], g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(A.pos, 3)); g.setIndex(A.ind); g.computeVertexNormals();
    group.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color:A.hex, side:THREE.DoubleSide }))); delete accs[k]; }
}
const framesOf = ps => ps.map((p, i) => { const a = ps[Math.max(i - 1, 0)], b = ps[Math.min(i + 1, ps.length - 1)];
  const l = Math.hypot(b.x - a.x, b.z - a.z) || 1; return { x:-(b.z - a.z) / l, z:(b.x - a.x) / l }; });
const xTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  g.fillStyle = '#f2c230'; g.fillRect(0, 0, 128, 128); g.strokeStyle = '#111'; g.lineWidth = 8; g.strokeRect(4, 4, 120, 120);
  g.lineWidth = 16; g.beginPath(); g.moveTo(26, 26); g.lineTo(102, 102); g.moveTo(102, 26); g.lineTo(26, 102); g.stroke();
  return new THREE.CanvasTexture(c); })();

async function fetchOSM(a, kx, kz, coords) {
  let s = 90, w = 180, n = -90, e = -180;
  for (const c of coords) { s = Math.min(s, c.lat); n = Math.max(n, c.lat); w = Math.min(w, c.lon); e = Math.max(e, c.lon); }
  const pad = .0025, bb = `${s - pad},${w - pad},${n + pad},${e + pad}`;
  const q = `[out:json][timeout:25];(way["building"](${bb});way["highway"~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|service|road)(_link)?$"](${bb}););out geom;`;
  const mirrors = ['https://overpass.openstreetmap.fr/api/interpreter', 'https://overpass.private.coffee/api/interpreter',
    'https://overpass-api.de/api/interpreter', 'https://lz4.overpass-api.de/api/interpreter'];
  let j = null, last = '';
  for (const url of mirrors) {
    try {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 25000);
      const r = await fetch(url, { method:'POST', body:new URLSearchParams({ data:q }), signal:ctl.signal });
      clearTimeout(t);
      if (!r.ok) throw new Error('status ' + r.status);
      j = await r.json(); break;
    } catch (err) { last = err.name === 'AbortError' ? 'timeout' : err.message; console.warn('Overpass failed:', url, err); }
  }
  if (!j) throw new Error('all Overpass servers failed (' + last + ')');
  const xz = g => ({ x:(g.lon - a.lon) * kx, z:-(g.lat - a.lat) * kz });
  const roads = [], buildings = [];
  for (const el of j.elements || []) {
    if (!el.geometry || el.geometry.length < 2) continue;
    const t = el.tags || {};
    if (t.highway) { if (t.tunnel && t.tunnel !== 'no') continue; roads.push({ pts:el.geometry.map(xz), t }); }
    else if (t.building && el.geometry.length >= 4) buildings.push({ fp:el.geometry.map(xz), t });
  }
  if (!roads.length && !buildings.length) throw new Error(j.remark || 'no data returned');
  return { roads, buildings };
}

const pins = []; let clicks = 0;
