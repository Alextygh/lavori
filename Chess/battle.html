        <span id="name-top">—</span>
        <span class="thinking-indicator" id="think-top"></span>
      </span>
      <span class="ps-captured" id="cap-top"></span>
      <span class="ps-score"    id="score-top"></span>
    </div>

    <div id="board-outer">
      <div id="board"></div>
      <div id="split-line"></div>
    </div>

    <!-- Bottom player -->
    <div class="player-strip" id="strip-bot">
      <span class="ps-name">
        <span class="ps-dot" id="dot-bot"></span>
        <span id="name-bot">—</span>
        <span class="thinking-indicator" id="think-bot"></span>
      </span>
      <span class="ps-captured" id="cap-bot"></span>
      <span class="ps-score"    id="score-bot"></span>
    </div>
  </div>

  <!-- Info column -->
  <div id="info-col">
    <div class="info-card">
      <h3>Status</h3>
      <div id="status-text">—</div>
    </div>
    <div class="info-card">
      <h3>Moves</h3>
      <div id="history-list"></div>
      <button id="pgn-copy-btn" onclick="copyPgn()">⎘ Copy PGN</button>
    </div>
    <div class="info-card" style="gap:8px">
      <h3>Controls</h3>
      <button class="ctrl-btn" onclick="pauseResume()" id="btn-pause">⏸ Pause</button>
      <button class="ctrl-btn" onclick="goToSetup()"  >⚙ New matchup</button>
      <button class="ctrl-btn primary" onclick="backToMenu()">✕ Back to bots</button>
    </div>
  </div>
</div>

<!-- RESULT BANNER -->
<div id="result-banner">
  <div id="result-box">
    <div id="result-trophy">🏆</div>
    <div id="result-title">—</div>
    <div id="result-subtitle">—</div>
    <div class="result-actions">
      <button class="result-btn primary"   onclick="rematch()">⟳ Rematch</button>
      <button class="result-btn secondary" onclick="viewBoard()">🔍 View board</button>
      <button class="result-btn secondary" onclick="goToSetup()">⚙ New matchup</button>
      <button class="result-btn secondary" onclick="backToMenu()">← Back to bots</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════════════════════
const BOTS_JSON = 'bots.json';
const FILES = ['a','b','c','d','e','f','g','h'];
const PIECE_KEYS = ['wk','wq','wr','wb','wn','wp','bk','bq','br','bb','bn','bp'];
const UNI = { wk:'♔',wq:'♕',wr:'♖',wb:'♗',wn:'♘',wp:'♙',bk:'♚',bq:'♛',br:'♜',bb:'♝',bn:'♞',bp:'♟' };
const PIECE_VALUES = { p:1, n:3, b:3, r:5, q:9, k:0 };

// Speed presets: [thinkMin, thinkMax, sfDepth]
const SPEED_PRESETS = {
  slow:    { thinkMin: 1200, thinkMax: 2400, depth: 14 },
  normal:  { thinkMin: 400,  thinkMax: 900,  depth: 10 },
  fast:    { thinkMin: 100,  thinkMax: 300,  depth: 7  },
  instant: { thinkMin: 0,    thinkMax: 50,   depth: 5  },
};

// ══════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════
let allBots     = [];
let botA        = null;   // first bot picked in setup
let botB        = null;   // second bot picked in setup
let whiteBot    = null;   // bot playing white this game
let blackBot    = null;   // bot playing black this game
let whiteProfile = null;
let blackProfile = null;
let whitePieces = {};     // preloaded images for white bot: 'wp' -> HTMLImageElement
let blackPieces = {};     // preloaded images for black bot
let whiteTiles  = {};     // { light: url, dark: url } for white bot (rows 5-8)
let blackTiles  = {};     // { light: url, dark: url } for black bot (rows 1-4)
let sfWhite     = null;   // Stockfish worker for white
let sfBlack     = null;   // Stockfish worker for black
let chess       = null;
let lastMove    = null;
let sqSize      = 64;
let paused      = false;
let gameActive  = false;
let selectedSide = 'a';  // which bot plays white: 'a'|'b'|'random'
let selectedSpeed = 'normal';
let moveTimer   = null;

// ══════════════════════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', async () => {
  setLoadMsg('Loading bots…');
  try {
    const r = await fetch(BOTS_JSON);
    if (!r.ok) throw new Error(r.status);
    allBots = await r.json();
  } catch(e) {
    setLoadMsg('Failed to load bots.json: ' + e.message);
    return;
  }

  buildSetupGrids();
  document.getElementById('loading-overlay').classList.add('gone');
  document.getElementById('setup-overlay').style.display = 'flex';
});

// ══════════════════════════════════════════════════════════════
//  SETUP UI
// ══════════════════════════════════════════════════════════════
function buildSetupGrids() {
  ['white-grid','black-grid'].forEach((gridId, gIdx) => {
    const grid = document.getElementById(gridId);
    grid.innerHTML = '';
    allBots.forEach(bot => {
      const card = document.createElement('div');
      card.className = 'bot-select-card';
      card.dataset.botId = bot.id;
      card.innerHTML = `
        <img class="bsc-img" src="${escHtml(bot.image)}" alt="${escHtml(bot.name)}"
             onerror="this.src='https://images.unsplash.com/photo-1529699211952-734e80c4d42b?w=400&q=60'"/>
        <div class="bsc-name">${escHtml(bot.name)}</div>
      `;
      card.addEventListener('click', () => selectBotForSlot(bot, gIdx === 0 ? 'A' : 'B', card, gridId));
      grid.appendChild(card);
    });
  });
}

function selectBotForSlot(bot, slot, card, gridId) {
  // slot: 'A' = white-grid, 'B' = black-grid
  const grid = document.getElementById(gridId);
  // Deselect same-slot previous
  grid.querySelectorAll('.bot-select-card').forEach(c => {
    c.classList.remove('selected-white', 'selected-black');
    const b = c.querySelector('.bsc-badge');
    if (b) b.remove();
  });
  const cssClass = slot === 'A' ? 'selected-white' : 'selected-black';
  card.classList.add(cssClass);
  const badge = document.createElement('span');
  badge.className = 'bsc-badge ' + (slot === 'A' ? 'white' : 'black');
  badge.textContent = slot;
  card.appendChild(badge);

  if (slot === 'A') botA = bot;
  else botB = bot;

  updateStartBtn();
}

function updateStartBtn() {
  const btn = document.getElementById('start-btn');
  if (botA && botB) {
    btn.disabled = false;
    btn.textContent = `⚔ ${botA.name} vs ${botB.name}`;
  } else {
    btn.disabled = true;
    btn.textContent = 'Select two bots to begin';
  }
}

function setSide(side) {
  selectedSide = side;
  document.querySelectorAll('.side-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.side === side);
  });
}

function setSpeed(spd) {
  selectedSpeed = spd;
  document.querySelectorAll('.speed-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.spd === spd);
  });
}

// ══════════════════════════════════════════════════════════════
//  START BATTLE
// ══════════════════════════════════════════════════════════════
async function startBattle() {
  document.getElementById('setup-overlay').style.display = 'none';
  document.getElementById('loading-overlay').classList.remove('gone');

  // Resolve sides
  let aIsWhite;
  if (selectedSide === 'random') aIsWhite = Math.random() < 0.5;
  else if (selectedSide === 'a')  aIsWhite = true;
  else                            aIsWhite = false;

  whiteBot = aIsWhite ? botA : botB;
  blackBot = aIsWhite ? botB : botA;

  // Load profiles
  setLoadMsg(`Loading ${whiteBot.name} style…`);
  whiteProfile = await loadProfile(whiteBot);
  setLoadMsg(`Loading ${blackBot.name} style…`);
  blackProfile = await loadProfile(blackBot);

  // Preload pieces for both bots
  setLoadMsg('Loading piece art…');
  await Promise.all([
    preloadPiecesFor(whiteBot.id, whitePieces),
    preloadPiecesFor(blackBot.id, blackPieces),
  ]);
  whiteTiles = { light: `images/${whiteBot.id}/wt.png`, dark: `images/${whiteBot.id}/bt.png` };
  blackTiles = { light: `images/${blackBot.id}/wt.png`, dark: `images/${blackBot.id}/bt.png` };

  // Start two Stockfish workers
  setLoadMsg('Starting engines…');
  sfWhite = sfBlack = null;
  const [ww, bw] = await Promise.allSettled([spawnSF(), spawnSF()]);
  sfWhite = ww.status === 'fulfilled' ? ww.value : null;
  sfBlack = bw.status === 'fulfilled' ? bw.value : null;
  if (sfWhite) applyProfileToWorker(sfWhite, whiteProfile);
  if (sfBlack) applyProfileToWorker(sfBlack, blackProfile);

  // Init game
  chess      = new Chess();
  lastMove   = null;
  paused     = false;
  gameActive = true;

  setupStrips();
  computeSqSize();
  buildBoard();
  renderBoard();
  updateHistory();
  updateCaptured();

  document.getElementById('loading-overlay').classList.add('gone');
  document.getElementById('game-wrap').classList.add('visible');
  document.getElementById('result-banner').classList.remove('show');

  updateStatus(`${whiteBot.name} (White) to move`, 'thinking');
  scheduleMove();
}

async function loadProfile(bot) {
  if (bot.lichessGame && bot.cloneSide) {
    try {
      const pgn = await fetchLichessPgn(bot.lichessGame);
      return buildProfile(pgn, bot.cloneSide, bot);
    } catch(_) {}
  }
  return profileFromRating(bot.rating);
}

// ══════════════════════════════════════════════════════════════
//  PRELOAD
// ══════════════════════════════════════════════════════════════
function preloadPiecesFor(botId, store) {
  const folder = `images/${botId}/`;
  return Promise.all(PIECE_KEYS.map(key => new Promise(res => {
    const img = new Image();
    img.onload  = () => { store[key] = img; res(); };
    img.onerror = () => { store[key] = null; res(); };
    img.src = `${folder}${key}.png`;
  })));
}

// ══════════════════════════════════════════════════════════════
//  STOCKFISH — two independent workers
// ══════════════════════════════════════════════════════════════
const SF_URLS = [
  'https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js',
  'https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js',
];

function spawnWorkerFromUrl(url) {
  return new Promise((resolve, reject) => {
    let w;
    try { w = new Worker(url); } catch(e) { return reject(e); }
    const t = setTimeout(() => { w.terminate(); reject(new Error('timeout')); }, 10000);
    w.onmessage = e => {
      if (typeof e.data === 'string' && e.data.includes('Stockfish')) {
        clearTimeout(t); resolve(w);
      }
    };
    w.onerror = e => { clearTimeout(t); w.terminate(); reject(e); };
    w.postMessage('uci');
  });
}

async function spawnBlobWorker(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const src  = await r.text();
  const blob = new Blob([src], { type: 'application/javascript' });
  return spawnWorkerFromUrl(URL.createObjectURL(blob));
}

async function spawnSF() {
  for (const url of SF_URLS) {
    try { return await spawnWorkerFromUrl(url); } catch(_) {}
  }
  for (const url of SF_URLS) {
    try { return await spawnBlobWorker(url); } catch(_) {}
  }
  throw new Error('Stockfish unavailable');
}

function applyProfileToWorker(worker, p) {
  worker.postMessage('ucinewgame');
  worker.postMessage(`setoption name Skill Level value ${p.skillLevel}`);
  worker.postMessage(`setoption name UCI_LimitStrength value true`);
  worker.postMessage(`setoption name UCI_Elo value ${p.ratingElo}`);
  worker.postMessage(`setoption name MultiPV value 5`);
  worker.postMessage('isready');
}

// ══════════════════════════════════════════════════════════════
//  BOARD SIZING & BUILD
// ══════════════════════════════════════════════════════════════
function computeSqSize() {
  const maxW = Math.min(window.innerWidth - 32, 520);
  const maxH = window.innerHeight - 180;
  sqSize = Math.floor(Math.min(maxW, maxH) / 8);
  const total = sqSize * 8;
  const outer = document.getElementById('board-outer');
  outer.style.width  = total + 'px';
  outer.style.height = total + 'px';
  const board = document.getElementById('board');
  board.style.width  = total + 'px';
  board.style.height = total + 'px';
}
window.addEventListener('resize', () => {
  if (chess) { computeSqSize(); buildBoard(); renderBoard(); }
});

// Which half of the board (from top = row 0..7) belongs to which bot?
// Rows 0-3 (ranks 8-5) = black bot's territory → blackTiles
// Rows 4-7 (ranks 4-1) = white bot's territory → whiteTiles
function tileForRow(row, isLight) {
  // row 0 = top of board (rank 8), row 7 = bottom (rank 1)
  const tiles = row < 4 ? blackTiles : whiteTiles;
  return isLight ? tiles.light : tiles.dark;
}

function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';

  // Remove old coord overlays
  const outer = document.getElementById('board-outer');
  outer.querySelectorAll('.board-coords-left,.board-coords-bottom').forEach(el => el.remove());

  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      const file = FILES[col];
      const rank = 8 - row;
      const sq   = file + rank;
      const isLight = (col + row) % 2 === 0;

      const div = document.createElement('div');
      div.className = 'sq';
      div.id        = 'sq-' + sq;
      div.style.width  = sqSize + 'px';
      div.style.height = sqSize + 'px';
      div.style.backgroundImage = `url('${tileForRow(row, isLight)}')`;
      div.style.backgroundSize  = 'cover';
      div.classList.add(isLight ? 'light-fallback' : 'dark-fallback');
      board.appendChild(div);
    }
  }

  // Rank labels — left side
  const leftCol = document.createElement('div');
  leftCol.className = 'board-coords-left';
  for (let row = 0; row < 8; row++) {
    const rank = 8 - row;
    const span = document.createElement('span');
    span.className = 'coord-label';
    span.style.width  = '18px';
    span.style.height = sqSize + 'px';
    span.textContent  = rank;
    leftCol.appendChild(span);
  }
  outer.appendChild(leftCol);

  // File labels — bottom
  const bottomRow = document.createElement('div');
  bottomRow.className = 'board-coords-bottom';
  for (let col = 0; col < 8; col++) {
    const span = document.createElement('span');
    span.className = 'coord-label';
    span.style.width  = sqSize + 'px';
    span.style.height = '18px';
    span.textContent  = FILES[col];
    bottomRow.appendChild(span);
  }
  outer.appendChild(bottomRow);

  // Reposition the split line
  const line = document.getElementById('split-line');
  line.style.top = (sqSize * 4) + 'px';
}

// ══════════════════════════════════════════════════════════════
//  RENDER BOARD
// The key innovation: each piece is rendered using ITS OWN BOT'S
// piece images, regardless of which square it's on.
// Piece owner = chess piece color (white pieces always use whiteBot's
// images, black pieces always use blackBot's images).
// ══════════════════════════════════════════════════════════════
function renderBoard() {
  const inCheck = chess.in_check();
  const kingSq  = inCheck ? findKing(chess.turn()) : null;

  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      const file = FILES[col];
      const rank = 8 - row;
      const sq   = file + rank;
      const div  = document.getElementById('sq-' + sq);
      if (!div) continue;

      div.classList.remove('hl-last','hl-check');
      [...div.querySelectorAll('.piece-img, .owner-dot')].forEach(el => el.remove());

      if (sq === lastMove?.from || sq === lastMove?.to) div.classList.add('hl-last');
      if (sq === kingSq) div.classList.add('hl-check');

      const piece = chess.get(sq);
      if (piece) {
        // Use the owning bot's piece image store
        const store = piece.color === 'w' ? whitePieces : blackPieces;
        const key   = piece.color + piece.type;
        const img   = document.createElement('img');
        img.className = 'piece-img';
        img.alt = key;
        if (store[key]) {
          img.src = store[key].src;
        } else {
          // Unicode fallback
          img.style.display = 'none';
          const fb = document.createElement('span');
          fb.style.cssText = `position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:${sqSize * 0.7}px;pointer-events:none;z-index:2;`;
          fb.textContent = UNI[key] || '?';
          div.appendChild(fb);
        }
        div.appendChild(img);
      }
    }
  }
}

function findKing(color) {
  for (const f of FILES) for (let r = 1; r <= 8; r++) {
    const sq = f + r, p = chess.get(sq);
    if (p && p.type === 'k' && p.color === color) return sq;
  }
  return null;
}

// ══════════════════════════════════════════════════════════════
//  PLAYER STRIPS
// ══════════════════════════════════════════════════════════════
function setupStrips() {
  // Board is always shown from white's perspective (white at bottom)
  // Top strip = black bot, bottom strip = white bot
  document.getElementById('name-top').textContent = blackBot.name + ' (Black)';
  document.getElementById('name-bot').textContent = whiteBot.name + ' (White)';
  document.getElementById('dot-top').className = 'ps-dot black-dot';
  document.getElementById('dot-bot').className = 'ps-dot white-dot';
}

// ══════════════════════════════════════════════════════════════
//  MOVE SCHEDULING
// ══════════════════════════════════════════════════════════════
function scheduleMove() {
  if (!gameActive || paused || chess.game_over()) return;

  const speed   = SPEED_PRESETS[selectedSpeed];
  const turn    = chess.turn();                // 'w' | 'b'
  const profile = turn === 'w' ? whiteProfile : blackProfile;
  const worker  = turn === 'w' ? sfWhite : sfBlack;

  // Show thinking indicator
  const topInd = document.getElementById('think-top');
  const botInd = document.getElementById('think-bot');
  topInd.classList.toggle('active', turn === 'b');
  botInd.classList.toggle('active', turn === 'w');

  const thinkMin = speed.thinkMin;
  const thinkMax = speed.thinkMax;
  const depth    = speed.depth;

  if (worker) {
    getBotMoveFromSF(worker, profile, depth, (move) => {
      const delay = thinkMin + Math.random() * (thinkMax - thinkMin);
      moveTimer = setTimeout(() => applyMove(move), delay);
    });
  } else {
    // No engine — random move
    const delay = thinkMin + Math.random() * (thinkMax - thinkMin);
    moveTimer = setTimeout(() => {
      const moves = chess.moves({ verbose: true });
      if (moves.length) applyMove(moves[Math.floor(Math.random() * moves.length)]);
    }, delay);
  }
}

function getBotMoveFromSF(worker, profile, depth, callback) {
  const fen = chess.fen();
  const legalMvs = chess.moves({ verbose: true });
  const candidates = [];

  const handler = e => {
    const line = e.data;
    if (typeof line !== 'string') return;
    const pvMatch = line.match(/multipv (\d+).*?score cp (-?\d+).*? pv (\S+)/);
    if (pvMatch) {
      const idx   = parseInt(pvMatch[1]) - 1;
      const score = parseInt(pvMatch[2]);
      const uci   = pvMatch[3];
      candidates[idx] = { uci, score };
    }
    if (line.startsWith('bestmove')) {
      worker.removeEventListener('message', handler);
      const best = line.split(' ')[1];
      const finalCandidates = candidates.filter(Boolean);
      if (!finalCandidates.length) finalCandidates.push({ uci: best, score: 0 });
      const move = pickStyleMove(legalMvs, finalCandidates, profile);
      callback(move);
    }
  };

  worker.addEventListener('message', handler);
  worker.postMessage(`position fen ${fen}`);
  worker.postMessage(`go depth ${depth}`);
}

function pickStyleMove(legalMvs, candidates, profile) {
  const scored = candidates.map(c => {
    const from = c.uci.slice(0,2), to = c.uci.slice(2,4);
    const mv = legalMvs.find(m => m.from === from && m.to === to);
    if (!mv) return null;
    let bias = 0;
    const isCapture  = mv.flags.includes('c') || mv.flags.includes('e');
    const isCheck    = mv.san && (mv.san.includes('+') || mv.san.includes('#'));
    const isCastle   = mv.flags.includes('k') || mv.flags.includes('q');
    const toFile     = to[0];
    const isKingside  = ['f','g','h'].includes(toFile);
    const isQueenside = ['a','b','c'].includes(toFile);
    if (isCapture) bias += profile.aggression * 0.4;
    if (isCheck)   bias += profile.tactical   * 0.5;
    if (isCastle && !profile.castledEarly) bias += profile.positional * 0.3;
    if (!isCapture && mv.piece !== 'p') bias += profile.positional * 0.15;
    if (isKingside  && profile.prefersKingside)  bias += 8;
    if (isQueenside && !profile.prefersKingside) bias += 8;
    if (mv.piece === 'k' && !isCastle) bias -= profile.defensive * 0.4;
    const engineWeight = 1 - (profile.aggression / 200);
    return { mv, total: c.score * engineWeight + bias * 10 };
  }).filter(Boolean);

  if (scored.length) {
    scored.sort((a,b) => b.total - a.total);
    // bot rating influences sloppiness
    const bot = chess.turn() === 'w' ? whiteBot : blackBot;
    const sloppiness = Math.max(0, (400-(bot.rating||200))/400);
    const idx = Math.random() < sloppiness * 0.6
      ? Math.floor(Math.random() * Math.min(scored.length, 3)) : 0;
    return scored[idx].mv;
  }
  return legalMvs[Math.floor(Math.random() * legalMvs.length)];
}

// ══════════════════════════════════════════════════════════════
//  APPLY MOVE
// ══════════════════════════════════════════════════════════════
function applyMove(move) {
  if (!gameActive || chess.game_over()) return;

  const result = chess.move({ from: move.from, to: move.to, promotion: move.promotion || 'q' });
  if (!result) {
    const fallback = chess.moves({ verbose: true })[0];
    if (!fallback) return;
    chess.move({ from: fallback.from, to: fallback.to, promotion: 'q' });
    lastMove = { from: fallback.from, to: fallback.to };
  } else {
    lastMove = { from: move.from, to: move.to };
  }

  renderBoard();
  updateHistory();
  updateCaptured();

  if (chess.game_over()) { handleGameOver(); return; }

  const next = chess.turn() === 'w' ? whiteBot : blackBot;
  updateStatus(`${next.name} is thinking…`, 'thinking');
  scheduleMove();
}

// ══════════════════════════════════════════════════════════════
//  GAME OVER
// ══════════════════════════════════════════════════════════════
function handleGameOver() {
  gameActive = false;
  document.getElementById('think-top').classList.remove('active');
  document.getElementById('think-bot').classList.remove('active');

  let title, subtitle, trophy = '🏆';
  if (chess.in_checkmate()) {
    const winner = chess.turn() === 'w' ? blackBot : whiteBot;
    const loser  = chess.turn() === 'w' ? whiteBot : blackBot;
    title    = `${winner.name} wins!`;
    subtitle = `${loser.name} was checkmated`;
    trophy   = '🏆';
  } else if (chess.in_stalemate()) {
    title = 'Stalemate'; subtitle = 'The game is a draw'; trophy = '🤝';
  } else if (chess.in_draw()) {
    title = 'Draw'; subtitle = chess.in_threefold_repetition() ? 'Threefold repetition' : '50-move rule or insufficient material'; trophy = '🤝';
  } else {
    title = 'Game over'; subtitle = ''; trophy = '♟';
  }

  updateStatus(title, 'result');
  document.getElementById('result-trophy').textContent   = trophy;
  document.getElementById('result-title').textContent    = title;
  document.getElementById('result-subtitle').textContent = subtitle;
  document.getElementById('result-banner').classList.add('show');
}

// ══════════════════════════════════════════════════════════════
//  CONTROLS
// ══════════════════════════════════════════════════════════════
function pauseResume() {
  if (!gameActive) return;
  paused = !paused;
  document.getElementById('btn-pause').textContent = paused ? '▶ Resume' : '⏸ Pause';
  if (!paused) scheduleMove();
  else if (moveTimer) { clearTimeout(moveTimer); moveTimer = null; }
}

function rematch() {
  document.getElementById('result-banner').classList.remove('show');
  // Swap sides
  [whiteBot, blackBot] = [blackBot, whiteBot];
  [whiteProfile, blackProfile] = [blackProfile, whiteProfile];
  [whitePieces, blackPieces]   = [blackPieces, whitePieces];
  [whiteTiles, blackTiles]     = [blackTiles, whiteTiles];
  [sfWhite, sfBlack]           = [sfBlack, sfWhite];
  if (sfWhite) applyProfileToWorker(sfWhite, whiteProfile);
  if (sfBlack) applyProfileToWorker(sfBlack, blackProfile);

  chess    = new Chess();
  lastMove = null;
  paused   = false;
  gameActive = true;
  document.getElementById('btn-pause').textContent = '⏸ Pause';

  setupStrips();
  buildBoard();
  renderBoard();
  updateHistory();
  updateCaptured();
  updateStatus(`${whiteBot.name} (White) to move`, 'thinking');
  scheduleMove();
}

function goToSetup() {
  gameActive = false;
  if (moveTimer) { clearTimeout(moveTimer); moveTimer = null; }
  document.getElementById('result-banner').classList.remove('show');
  document.getElementById('game-wrap').classList.remove('visible');
  document.getElementById('setup-overlay').style.display = 'flex';
  // Reset bot selections
  botA = botB = null;
  updateStartBtn();
  ['white-grid','black-grid'].forEach(id => {
    document.querySelectorAll(`#${id} .bot-select-card`).forEach(c => {
      c.classList.remove('selected-white','selected-black');
      const b = c.querySelector('.bsc-badge');
      if (b) b.remove();
    });
  });
}

function backToMenu() { location.href = 'index.html'; }

// ══════════════════════════════════════════════════════════════
//  STATUS, HISTORY, CAPTURED
// ══════════════════════════════════════════════════════════════
function updateStatus(msg, cls='') {
  const el = document.getElementById('status-text');
  el.textContent = msg; el.className = cls;
}

function updateHistory() {
  const h  = chess.history();
  const el = document.getElementById('history-list');
  el.innerHTML = '';
  for (let i = 0; i < h.length; i += 2) {
    const row = document.createElement('div');
    row.className = 'hist-row';
    row.innerHTML = `<span class="hist-num">${i/2+1}.</span><span class="hist-w">${h[i]||''}</span><span class="hist-b">${h[i+1]||''}</span>`;
    el.appendChild(row);
  }
  el.scrollTop = el.scrollHeight;
}

function updateCaptured() {
  const onBoard = { w:{p:0,n:0,b:0,r:0,q:0,k:0}, b:{p:0,n:0,b:0,r:0,q:0,k:0} };
  const start   = { p:8, n:2, b:2, r:2, q:1, k:1 };
  for (const f of FILES) for (let r = 1; r <= 8; r++) {
    const p = chess.get(f+r);
    if (p) onBoard[p.color][p.type]++;
  }
  let wScore=0, bScore=0;
  const wCap=[], bCap=[];
  for (const t of ['p','n','b','r','q']) {
    const wLost = start[t] - onBoard.w[t];
    const bLost = start[t] - onBoard.b[t];
    for (let i=0;i<wLost;i++) { bCap.push(UNI['w'+t]); bScore += PIECE_VALUES[t]; }
    for (let i=0;i<bLost;i++) { wCap.push(UNI['b'+t]); wScore += PIECE_VALUES[t]; }
  }
  // Top = black bot, bottom = white bot
  document.getElementById('cap-top').textContent   = wCap.join('');  // black captured white's pieces
  document.getElementById('cap-bot').textContent   = bCap.join('');  // white captured black's pieces
  const delta = wScore - bScore;
  document.getElementById('score-top').textContent = wScore > bScore ? `+${delta}` : '';
  document.getElementById('score-bot').textContent = bScore > wScore ? `+${-delta}` : '';
}

// ══════════════════════════════════════════════════════════════
//  LICHESS + PROFILE (same logic as play.html)
// ══════════════════════════════════════════════════════════════
async function fetchLichessPgn(gameId) {
  const r = await fetch(
    `https://lichess.org/game/export/${gameId}?moves=true&opening=true&clocks=false`,
    { headers: { Accept: 'application/x-chess-pgn' } }
  );
  if (!r.ok) throw new Error(`Lichess ${r.status}`);
  return r.text();
}

function buildProfile(pgn, side, bot) {
  let movesSection = pgn.replace(/\[.*?\]\s*/gs, '').trim();
  movesSection = movesSection.replace(/\{[^}]*\}/g, '').replace(/\d+\./g, '')
                             .replace(/1-0|0-1|1\/2-1\/2|\*/g, '').trim();
  const all   = movesSection.split(/\s+/).filter(m => m && !/^\d/.test(m));
  const moves = all.filter((_, i) => side === 'white' ? i % 2 === 0 : i % 2 === 1);
  const n     = moves.length || 1;
  const totalPly = all.length;
  let captures=0,earlyCaptures=0,checks=0,ksAct=0,qsAct=0;
  let pawnMoves=0,pieceMoves=0,castledEarly=false,sacrificeSigns=0,earlyQueenMove=false;
  moves.forEach((mv, i) => {
    if (!mv) return;
    const cap = mv.includes('x'), chk = mv.includes('+') || mv.includes('#');
    const file = mv.replace(/[^a-h]/g,'')[0];
    if (cap) captures++;
    if (cap && i < 20) earlyCaptures++;
    if (chk) checks++;
    if (/^[a-h]/.test(mv)) pawnMoves++;
    if (/^[NBRQK]/.test(mv) && !cap) pieceMoves++;
    if (mv === 'O-O' || mv === 'O-O-O') { if (i < 12) castledEarly = true; }
    if (mv.startsWith('Q') && i < 6) earlyQueenMove = true;
    if (file && ['f','g','h'].includes(file)) ksAct++;
    if (file && ['a','b','c'].includes(file)) qsAct++;
    if (/^[NBRQ]x/.test(mv) && i < 15) sacrificeSigns++;
  });
  const clamp = v => Math.round(Math.max(0,Math.min(100,v)));
  const aggression = clamp((earlyCaptures/n)*120+(checks/n)*60+(earlyQueenMove?15:0)+(sacrificeSigns/n)*40);
  const positional = clamp((pieceMoves/n)*30+(castledEarly?25:0)+(totalPly>80?20:0)+(pawnMoves/n)*20);
  const tactical   = clamp((captures/n)*40+(checks/n)*50+(sacrificeSigns/n)*50+aggression*0.2);
  const defensive  = clamp((castledEarly?30:0)+(totalPly>80?25:0)+(1-aggression/100)*45);
  const prefersKingside = ksAct >= qsAct;
  const ratingStrength = (400-(bot.rating||200))/400;
  const styleStrength  = (positional*0.5+(100-aggression)*0.3+defensive*0.2)/100;
  const blended = ratingStrength*0.6+styleStrength*0.4;
  const ratingElo  = 600+Math.round(blended*2200);
  const skillLevel = Math.round(blended*20);
  return { aggression, positional, tactical, defensive, prefersKingside,
           skillLevel, ratingElo, castledEarly };
}

function profileFromRating(rating) {
  const strength   = (400-(rating||200))/400;
  const skillLevel = Math.round(strength*20);
  const ratingElo  = 600+Math.round(strength*2200);
  const aggression = Math.round((1-strength)*70+10);
  const positional = Math.round(strength*80);
  const tactical   = Math.round(strength*60+20);
  const defensive  = Math.round(strength*50+20);
  return { aggression, positional, tactical, defensive, prefersKingside: true,
           skillLevel, ratingElo, castledEarly: strength > 0.5 };
}

// ══════════════════════════════════════════════════════════════
//  PGN COPY
// ══════════════════════════════════════════════════════════════
function copyPgn() {
  const h = chess ? chess.history() : [];
  if (!h.length) return;
  let pgn = `[White "${whiteBot?.name || 'White'}"]\n[Black "${blackBot?.name || 'Black'}"]\n\n`;
  for (let i = 0; i < h.length; i++) {
    if (i % 2 === 0) pgn += `${i/2+1}. `;
    pgn += h[i] + ' ';
  }
  pgn = pgn.trim();
  const btn = document.getElementById('pgn-copy-btn');
  const done = () => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '⎘ Copy PGN'; btn.classList.remove('copied'); }, 2000);
  };
  navigator.clipboard.writeText(pgn).then(done).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = pgn; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); done();
  });
}
