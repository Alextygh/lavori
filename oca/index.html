<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet"><title>Game of the Goose</title>
<style>
:root{color-scheme:dark;--bg:#2b1d12;--panel:rgba(22,36,32,.88);--ink:#f4efdf;--mute:#a7b7a6;--acc:#f2c500;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 15px Fredoka,system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.p{position:fixed;background:var(--panel);border-radius:14px;padding:10px 12px;backdrop-filter:blur(6px)}
#hud{top:calc(10px + env(safe-area-inset-top,0px));left:10px;min-width:200px}
#hud div{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:8px}
#hud .on{background:rgba(242,197,0,.18)}
#hud i{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #fff6}
#hud small{color:var(--mute);margin-left:auto;white-space:nowrap}
#pot{color:var(--mute);padding:4px 6px 0}
#log{top:calc(10px + env(safe-area-inset-top,0px));right:10px;width:250px;color:var(--mute);font-size:13px;line-height:1.35}
#log b{color:var(--ink);font-weight:600}
#bar{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:94vw}
button{font:600 16px Fredoka,system-ui,sans-serif;border:0;border-radius:10px;padding:10px 16px;background:#3a5249;color:var(--ink);cursor:pointer}
a.b{font:600 14px Fredoka,system-ui,sans-serif;border-radius:10px;padding:8px 12px;background:#3a5249;color:var(--ink);text-decoration:none}
a.b:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
#roll{background:var(--acc);color:#2b2200;font-size:18px;padding:12px 22px}
#msg{min-width:130px}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,14,8,.62);z-index:5}
#ov .p{position:static;max-width:380px;text-align:center;padding:22px}
h1{font:600 28px Fredoka,system-ui,sans-serif;margin:0 0 4px}
.row{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.sw{width:42px;height:42px;border-radius:50%;padding:0;border:3px solid transparent}
.sw[aria-pressed=true],.nb[aria-pressed=true]{outline:3px solid var(--acc);outline-offset:2px}
.nb{min-width:42px;padding:8px 0}
#vw,#pl,#st{display:flex;gap:8px}
#vw{left:10px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#pl{right:10px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#st{top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%)}
.p button{padding:8px 12px;font-size:14px}
button[aria-pressed=true]:not(.sw):not(.nb){background:#4d7a5f}
@media(max-width:900px){#log{display:none}#st{left:auto;right:10px;transform:none}#vw,#pl{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
@media(max-width:700px){#hud{min-width:0;font-size:13px}}
