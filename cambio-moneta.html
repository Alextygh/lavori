<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Convertitore in Euro</title>
</head>
<body>
  <h1>Convertitore di valute in Euro</h1>

  <p>
    Divisa:
    <select id="divisa"></select>
  </p>
  <p>
    Quantità:
    <input type="number" id="quantita" value="1" min="0" step="any">
  </p>
  <p>
    <button onclick="converti()">Converti</button>
  </p>

  <p id="risultato"></p>
  <p id="data"></p>

  <script>
    var URL_BCE = "https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml";
    var tassi = {};

    function carica() {
      fetch(URL_BCE)
        .then(function (r) { return r.text(); })
        .then(function (testo) {
          var xml = new DOMParser().parseFromString(testo, "application/xml");
          var cubi = xml.getElementsByTagName("Cube");
          var select = document.getElementById("divisa");

          for (var i = 0; i < cubi.length; i++) {
            var valuta = cubi[i].getAttribute("currency");
            var tasso = cubi[i].getAttribute("rate");
            var data = cubi[i].getAttribute("time");

            if (data) {
              document.getElementById("data").textContent = "Tassi del " + data;
            }
            if (valuta && tasso) {
              tassi[valuta] = parseFloat(tasso);
              var opt = document.createElement("option");
              opt.value = valuta;
              opt.textContent = valuta;
              select.appendChild(opt);
            }
          }
        })
        .catch(function () {
          document.getElementById("risultato").textContent =
            "Errore nel caricamento dei tassi di cambio.";
        });
    }

    function converti() {
      var valuta = document.getElementById("divisa").value;
      var quantita = parseFloat(document.getElementById("quantita").value);

      if (isNaN(quantita) || !tassi[valuta]) {
        document.getElementById("risultato").textContent = "Dati non validi.";
        return;
      }
      var euro = quantita / tassi[valuta];
      document.getElementById("risultato").textContent =
        quantita + " " + valuta + " = " + euro.toFixed(2) + " EUR";
    }

    carica();
  </script>
</body>
</html>
