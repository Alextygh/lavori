<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="icon.ico">
<title>BUNKER-7 - COMMENDATION LOG</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
:root {
  --green: #39ff14;
  --green-dim: #4a7a4a;
  --green-dark: #1a3d1a;
  --green-bg: #0b150b;
  --bg: #050a05;
  --orange: #ff6600;
  --red: #ff3232;
  --yellow: #ffb300;
  --blue: #00bfff;
  --font: 'Share Tech Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #020402;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: var(--font);
}
#G {
  font-family: var(--font);
  background: var(--bg);
  color: var(--green);
  width: 900px;
  height: 640px;
  border: 1px solid var(--green-dark);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 60px rgba(57,255,20,0.07), 0 0 120px rgba(57,255,20,0.03);
}
#G::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px);
  pointer-events: none;
  z-index: 1;
}
.corner { position: absolute; width: 16px; height: 16px; border-color: var(--green-dim); border-style: solid; opacity: 0.4; z-index: 10; }
.corner.tl { top: 0; left: 0; border-width: 1px 0 0 1px; }
.corner.tr { top: 0; right: 0; border-width: 1px 1px 0 0; }
.corner.bl { bottom: 0; left: 0; border-width: 0 0 1px 1px; }
.corner.br { bottom: 0; right: 0; border-width: 0 1px 1px 0; }

/* HEADER */
#hdr {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 18px;
  background: var(--green-bg);
  border-bottom: 1px solid var(--green-dark);
  flex-shrink: 0;
  position: relative;
  z-index: 2;
}
.ht { font-size: 15px; letter-spacing: 4px; color: var(--green); }
.hright { display: flex; align-items: center; gap: 14px; }
#progress-label { font-size: 9px; color: var(--green-dim); letter-spacing: 2px; }
.back-btn {
  background: transparent;
  border: 1px solid var(--green-dark);
  color: var(--green-dim);
  font-family: var(--font);
  font-size: 9px;
  padding: 5px 12px;
  cursor: pointer;
  letter-spacing: 2px;
  transition: all 0.2s;
  border-radius: 2px;
  text-decoration: none;
  display: inline-block;
}
.back-btn:hover { border-color: var(--green); color: var(--green); }

/* CATEGORY TABS */
#tabs {
  display: flex;
  border-bottom: 1px solid var(--green-dark);
  background: #030703;
  flex-shrink: 0;
  position: relative;
  z-index: 2;
  overflow-x: auto;
}
.tab {
  font-family: var(--font);
  font-size: 8px;
  letter-spacing: 2px;
  padding: 8px 14px;
  cursor: pointer;
  color: var(--green-dim);
  border-bottom: 2px solid transparent;
  background: transparent;
  border-top: none;
  border-left: none;
  border-right: none;
  transition: all 0.15s;
  white-space: nowrap;
}
.tab:hover { color: var(--green); }
.tab.active { color: var(--green); border-bottom-color: var(--green); }

/* CONTENT */
#content {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
  position: relative;
  z-index: 2;
}
#content::-webkit-scrollbar { width: 3px; }
#content::-webkit-scrollbar-thumb { background: var(--green-dark); }

.ach-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.ach-card {
  background: var(--green-bg);
  border: 1px solid var(--green-dark);
  border-radius: 4px;
  padding: 12px 14px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  transition: border-color 0.2s;
}
.ach-card.unlocked {
  border-color: var(--green);
  background: #070f07;
}
.ach-card.locked {
  opacity: 0.5;
}

.ach-icon {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  margin-top: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ach-icon img {
  width: 28px;
  height: 28px;
  object-fit: contain;
  filter: grayscale(1) brightness(0.4);
  image-rendering: pixelated;
}
.ach-card.unlocked .ach-icon img {
  filter: drop-shadow(0 0 5px rgba(57,255,20,0.5));
}

.ach-info { flex: 1; min-width: 0; }
.ach-name {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--green-dim);
  margin-bottom: 3px;
  font-weight: bold;
}
.ach-card.unlocked .ach-name { color: var(--green); }
.ach-desc {
  font-size: 8px;
  color: #2a5a2a;
  line-height: 1.5;
  letter-spacing: 0.5px;
}
.ach-card.unlocked .ach-desc { color: var(--green-dim); }
.ach-date {
  font-size: 7px;
  color: var(--green-dark);
  margin-top: 4px;
  letter-spacing: 1px;
}
.ach-card.unlocked .ach-date { color: #2a5a2a; }

.ach-badge {
  font-size: 7px;
  letter-spacing: 1px;
  padding: 2px 5px;
  border-radius: 2px;
  margin-top: 4px;
  display: inline-block;
}
.ach-badge.unlocked-badge { color: var(--green); border: 1px solid var(--green-dark); }
.ach-badge.locked-badge { color: #1a3d1a; border: 1px solid #111; }

/* CATEGORY HEADER */
.cat-header {
  font-size: 9px;
  letter-spacing: 4px;
  color: var(--green-dim);
  padding: 6px 0 10px 0;
  border-bottom: 1px solid var(--green-dark);
  margin-bottom: 10px;
}

/* FOOTER BAR */
#footer-bar {
  background: var(--green-bg);
  border-top: 1px solid var(--green-dark);
  padding: 7px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  position: relative;
  z-index: 2;
}
#total-bar-wrap { flex: 1; max-width: 300px; height: 4px; background: #111; border-radius: 2px; overflow: hidden; margin: 0 14px; }
#total-bar-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width 0.5s; }
#footer-label { font-size: 8px; color: var(--green-dim); letter-spacing: 2px; }
</style>
</head>
<body>
<div id="G">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div id="hdr">
    <div class="ht">COMMENDATION LOG</div>
    <div class="hright">
      <div id="progress-label"></div>
      <button class="back-btn" onclick="navTo('menu.html')">MAIN MENU</button>
    </div>
  </div>

  <div id="tabs">
    <button class="tab active" onclick="showCat('all')">ALL</button>
    <button class="tab" onclick="showCat('completion')">COMPLETION</button>
    <button class="tab" onclick="showCat('residents')">RESIDENTS</button>
    <button class="tab" onclick="showCat('crisis')">CRISIS</button>
    <button class="tab" onclick="showCat('systems')">SYSTEMS</button>
    <button class="tab" onclick="showCat('score')">SCORE</button>
  </div>

  <div id="content"></div>

  <div id="footer-bar">
    <div id="footer-label"></div>
    <div id="total-bar-wrap"><div id="total-bar-fill"></div></div>
    <div id="footer-label2" style="font-size:8px;color:var(--green-dim);letter-spacing:2px"></div>
  </div>
</div>

<script>
// ===== BGM (continuous across pages) =====
const BGM = new Audio('./sound/bgm.mp3');
BGM.loop = true;

const SFX = {
  click: new Audio('./sound/click.mp3')
};

function loadSettings() {
  try {
    const raw = localStorage.getItem('bunker7_settings');
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}

function tryStartBGM() {
  const s = loadSettings();
  if (s.bgmEnabled === false) return;
  BGM.volume = (s.bgmVol ?? 40) / 100;
  const pos = parseFloat(sessionStorage.getItem('bgmPos') || '0');
  BGM.currentTime = pos;
  BGM.play().catch(() => {});
}

setInterval(() => {
  if (!BGM.paused) sessionStorage.setItem('bgmPos', BGM.currentTime);
}, 500);

function playSound(name) {
  try {
    const s = loadSettings();
    if (s.sfxEnabled === false) return;
    if (SFX[name]) {
      SFX[name].volume = (s.sfxVol ?? 100) / 100;
      SFX[name].currentTime = 0;
      SFX[name].play().catch(e => {});
    }
  } catch(e) {}
}

function navTo(url) {
  playSound('click');
  sessionStorage.setItem('bgmPos', BGM.currentTime);
  setTimeout(() => window.location.href = url, 200);
}

document.addEventListener('click', () => tryStartBGM(), { once: true });
window.addEventListener('DOMContentLoaded', tryStartBGM);

// ===== ACHIEVEMENTS =====
const ACHIEVEMENT_DEFS = [
  // COMPLETION
  { id:'bunker_secured',    cat:'completion', icon:'bunker_secured.png',    name:'BUNKER SECURED',    desc:'Survive all 10 waves and complete the mission.' },
  { id:'iron_operator',     cat:'completion', icon:'iron_operator.png',     name:'IRON OPERATOR',     desc:'Win on Hard difficulty.' },
  { id:'no_mercy',          cat:'completion', icon:'no_mercy.png',          name:'NO MERCY',          desc:'Win on Brutal difficulty.' },
  { id:'full_crew',         cat:'completion', icon:'full_crew.png',         name:'FULL CREW',         desc:'Win with all 5 residents still alive.' },
  { id:'perfect_run',       cat:'completion', icon:'perfect_run.png',       name:'PERFECT RUN',       desc:'Win with all systems above 50% at the end.' },
  // RESIDENTS
  { id:'first_responder',   cat:'residents',  icon:'first_responder.png',   name:'FIRST RESPONDER',   desc:'Successfully complete your first minigame.' },
  { id:'therapist',         cat:'residents',  icon:'therapist.png',         name:'THERAPIST',         desc:'Successfully complete 10 minigames in a single run.' },
  { id:'no_one_left',       cat:'residents',  icon:'no_one_left.png',       name:'NO ONE LEFT BEHIND',desc:'Rescue every personal crisis event in a single run.' },
  { id:'flatline',          cat:'residents',  icon:'flatline.png',          name:'FLATLINE',          desc:'Let a resident die. [Game Over]' },
  // CRISIS
  { id:'quick_thinking',    cat:'crisis',     icon:'quick_thinking.png',    name:'QUICK THINKING',    desc:'Resolve a crisis with less than 3 seconds remaining.' },
  { id:'five_alarm',        cat:'crisis',     icon:'five_alarm.png',        name:'FIVE ALARM',        desc:'Have 5 crises active simultaneously.' },
  { id:'analyst',           cat:'crisis',     icon:'analyst.png',           name:'ANALYST',           desc:'Correctly identify and resolve 3 Unknown Signals in one run.' },
  { id:'cascade_ctrl',      cat:'crisis',     icon:'cascade_ctrl.png',      name:'CASCADE CONTROLLER',desc:'Resolve a multi-step crisis without failing a step.' },
  // SYSTEMS
  { id:'breathing_room',    cat:'systems',    icon:'breathing_room.png',    name:'BREATHING ROOM',    desc:'Keep O2 above 80% for the entire game.' },
  { id:'zero_contamination',cat:'systems',    icon:'zero_contamination.png',name:'ZERO CONTAMINATION',desc:'Keep Radiation below 10% for the entire game.' },
  { id:'well_fed',          cat:'systems',    icon:'well_fed.png',          name:'WELL FED',          desc:'Never let Food drop below 30% throughout the game.' },
  { id:'blackout',          cat:'systems',    icon:'blackout.png',          name:'BLACKOUT',          desc:'Let Power hit 0% and survive it.' },
  { id:'good_vibes',        cat:'systems',    icon:'good_vibes.png',        name:'GOOD VIBES ONLY',   desc:'Finish a run with Morale above 90%.' },
  // SCORE
  { id:'point_hoarder',     cat:'score',      icon:'point_hoarder.png',     name:'POINT HOARDER',     desc:'Reach 5,000 points in a single run.' },
  { id:'high_roller',       cat:'score',      icon:'high_roller.png',       name:'HIGH ROLLER',       desc:'Reach 10,000 points in a single run.' },
  { id:'shopaholic',        cat:'score',      icon:'shopaholic.png',        name:'SHOPAHOLIC',        desc:'Spend all repair points in a single shop visit.' },
  { id:'penny_pincher',     cat:'score',      icon:'penny_pincher.png',     name:'PENNY PINCHER',     desc:'Win a run without spending any repair points.' },
];

const ACH_KEY = 'bunker7_achievements';

function loadAch() {
  try { const r = localStorage.getItem(ACH_KEY); return r ? JSON.parse(r) : {}; } catch(e) { return {}; }
}

let currentCat = 'all';

function showCat(cat) {
  playSound('click');
  currentCat = cat;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => {
    if (t.textContent.toLowerCase().trim() === (cat === 'all' ? 'all' : cat)) t.classList.add('active');
  });
  renderContent();
}

function renderContent() {
  const ach = loadAch();
  const defs = currentCat === 'all' ? ACHIEVEMENT_DEFS : ACHIEVEMENT_DEFS.filter(a => a.cat === currentCat);
  const total = ACHIEVEMENT_DEFS.length;
  const unlocked = Object.keys(ach).filter(k => ach[k]).length;

  document.getElementById('progress-label').textContent = unlocked + ' / ' + total + ' UNLOCKED';
  document.getElementById('footer-label').textContent = unlocked + ' / ' + total;
  document.getElementById('total-bar-fill').style.width = (unlocked / total * 100) + '%';
  document.getElementById('footer-label2').textContent = Math.round(unlocked / total * 100) + '% COMPLETE';

  const content = document.getElementById('content');

  if (currentCat === 'all') {
    const cats = [
      { key: 'completion', label: 'COMPLETION' },
      { key: 'residents',  label: 'RESIDENTS AND MINIGAMES' },
      { key: 'crisis',     label: 'CRISIS MANAGEMENT' },
      { key: 'systems',    label: 'SYSTEMS' },
      { key: 'score',      label: 'SCORE / SKILL' },
    ];
    content.innerHTML = cats.map(c => {
      const items = ACHIEVEMENT_DEFS.filter(a => a.cat === c.key);
      return `<div class="cat-header">${c.label}</div>
        <div class="ach-grid" style="margin-bottom:16px">${items.map(a => cardHTML(a, ach)).join('')}</div>`;
    }).join('');
  } else {
    content.innerHTML = `<div class="ach-grid">${defs.map(a => cardHTML(a, ach)).join('')}</div>`;
  }
}

function cardHTML(a, ach) {
  const isUnlocked = !!ach[a.id];
  const date = ach[a.id] ? new Date(ach[a.id]).toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'2-digit'}) : null;
  return `<div class="ach-card ${isUnlocked ? 'unlocked' : 'locked'}">
    <div class="ach-icon"><img src="./achievements/${a.icon}" alt="${a.name}" onerror="this.style.display='none'"></div>
    <div class="ach-info">
      <div class="ach-name">${a.name}</div>
      <div class="ach-desc">${a.desc}</div>
      ${date ? `<div class="ach-date">UNLOCKED ${date}</div>` : ''}
      <span class="ach-badge ${isUnlocked ? 'unlocked-badge' : 'locked-badge'}">${isUnlocked ? 'UNLOCKED' : 'LOCKED'}</span>
    </div>
  </div>`;
}

renderContent();
</script>
</body>
</html>
