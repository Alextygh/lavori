<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Emergency Services Map</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e8eaf0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #151820;
      border-bottom: 1px solid #252a38;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      z-index: 1000;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #fff;
      white-space: nowrap;
    }

    .logo span { color: #e05252; }

    .search-wrap {
      display: flex;
      flex: 1;
      max-width: 440px;
      gap: 8px;
    }

    #search-input {
      flex: 1;
      background: #1e2230;
      border: 1px solid #2e3448;
      border-radius: 8px;
      padding: 9px 14px;
      color: #e8eaf0;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #search-input::placeholder { color: #5a6070; }
    #search-input:focus { border-color: #4a80d4; }

    #search-btn {
      background: #4a80d4;
      border: none;
      border-radius: 8px;
      padding: 9px 18px;
      color: #fff;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    #search-btn:hover { background: #3a6ec4; }
    #search-btn:disabled { background: #2a3a5a; cursor: default; }

    .legend {
      display: flex;
      gap: 16px;
      margin-left: auto;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: #9aa0b8;
    }

    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    #map { flex: 1; }

    #status-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e2230ee;
      border: 1px solid #2e3448;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 0.85rem;
      color: #9aa0b8;
      z-index: 1000;
      display: none;
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }

    #status-bar.visible { display: block; }

    /* Leaflet popup tweaks */
    .leaflet-popup-content-wrapper {
      background: #1e2230;
      border: 1px solid #2e3448;
      border-radius: 10px;
      box-shadow: 0 4px 24px #000a;
    }

    .leaflet-popup-tip { background: #1e2230; }

    .leaflet-popup-content {
      color: #e8eaf0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 0.88rem;
      margin: 10px 14px;
    }

    .popup-title {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .popup-type {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.65;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Emergency<span>Map</span></div>
  <div class="search-wrap">
    <input id="search-input" type="text" placeholder="Search a city or address…" />
    <button id="search-btn">Search</button>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div> Hospital</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div> Fire Station</div>
    <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div> Police</div>
  </div>
</header>

<div id="map"></div>
<div id="status-bar">Loading…</div>

<script>
  // ── Map setup ──────────────────────────────────────────────────────────────
  const map = L.map('map').setView([48.8566, 2.3522], 13);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd', maxZoom: 19
  }).addTo(map);

  // ── SVG icon factory ───────────────────────────────────────────────────────
  function makeIcon(svgContent, color) {
    const size = 38;
    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="18" fill="${color}" opacity="0.92"/>
        <circle cx="20" cy="20" r="18" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
        ${svgContent}
      </svg>`;
    return L.divIcon({
      html: `<div style="filter:drop-shadow(0 2px 6px #0008)">${svg}</div>`,
      className: '',
      iconSize: [size, size],
      iconAnchor: [size / 2, size / 2],
      popupAnchor: [0, -size / 2]
    });
  }

  // Hospital: white cross
  const hospitalIcon = makeIcon(`
    <rect x="17" y="10" width="6" height="20" rx="2" fill="#fff"/>
    <rect x="10" y="17" width="20" height="6" rx="2" fill="#fff"/>`, '#3b82f6');

  // Fire station: flame
  const fireIcon = makeIcon(`
    <path d="M20 10 C20 10 26 15 26 21 C26 25.4 23.3 28.8 20 29.5 C16.7 28.8 14 25.4 14 21 C14 17 17 13 18 11 C18 13.5 19.5 15 21 16 C20 13 20 10 20 10Z" fill="#fff" opacity="0.95"/>
    <path d="M20 19 C20 19 23 22 23 24.5 C23 26.4 21.7 28 20 28 C18.3 28 17 26.4 17 24.5 C17 22 20 19 20 19Z" fill="#fca5a5"/>`, '#ef4444');

  // Police: shield + star
  const policeIcon = makeIcon(`
    <path d="M20 11 L27 14.5 L27 22 C27 26 23.5 29 20 30 C16.5 29 13 26 13 22 L13 14.5 Z" fill="#fff" opacity="0.9"/>
    <path d="M20 17 L21.2 20.6 L25 20.6 L22 22.8 L23.1 26.4 L20 24.2 L16.9 26.4 L18 22.8 L15 20.6 L18.8 20.6 Z" fill="#3b82f6"/>`, '#22c55e');

  // ── Layer groups ───────────────────────────────────────────────────────────
  const layers = {
    hospital: L.layerGroup().addTo(map),
    fire_station: L.layerGroup().addTo(map),
    police: L.layerGroup().addTo(map),
  };

  const iconMap = { hospital: hospitalIcon, fire_station: fireIcon, police: policeIcon };
  const labelMap = { hospital: 'Hospital', fire_station: 'Fire Station', police: 'Police Station' };
  const colorMap = { hospital: '#3b82f6', fire_station: '#ef4444', police: '#22c55e' };

  // ── Overpass query ─────────────────────────────────────────────────────────
  let lastRequest = null;

  function setStatus(msg, persist = false) {
    const el = document.getElementById('status-bar');
    el.textContent = msg;
    el.classList.add('visible');
    if (!persist) setTimeout(() => el.classList.remove('visible'), 3000);
  }

  async function loadEmergencyServices(bounds) {
    const { _southWest: sw, _northEast: ne } = bounds;
    const bbox = `${sw.lat},${sw.lng},${ne.lat},${ne.lng}`;

    const query = `
      [out:json][timeout:25];
      (
        node[amenity=hospital](${bbox});
        way[amenity=hospital](${bbox});
        node[amenity=fire_station](${bbox});
        way[amenity=fire_station](${bbox});
        node[amenity=police](${bbox});
        way[amenity=police](${bbox});
      );
      out center;
    `;

    const url = 'https://overpass-api.de/api/interpreter';
    const ctrl = new AbortController();
    if (lastRequest) lastRequest.abort();
    lastRequest = ctrl;

    setStatus('Fetching emergency services…', true);
    document.getElementById('search-btn').disabled = true;

    try {
      const res = await fetch(url, {
        method: 'POST',
        body: query,
        signal: ctrl.signal
      });
      const data = await res.json();

      // Clear layers
      Object.values(layers).forEach(l => l.clearLayers());

      let counts = { hospital: 0, fire_station: 0, police: 0 };

      data.elements.forEach(el => {
        const type = el.tags?.amenity;
        if (!type || !layers[type]) return;

        const lat = el.lat ?? el.center?.lat;
        const lon = el.lon ?? el.center?.lon;
        if (!lat || !lon) return;

        const name = el.tags.name || labelMap[type];

        const marker = L.marker([lat, lon], { icon: iconMap[type] });
        marker.bindPopup(`
          <div class="popup-type" style="color:${colorMap[type]}">${labelMap[type]}</div>
          <div class="popup-title">${name}</div>
          ${el.tags['addr:street'] ? `<div style="opacity:.6;margin-top:3px">${el.tags['addr:street']}${el.tags['addr:housenumber'] ? ' ' + el.tags['addr:housenumber'] : ''}</div>` : ''}
        `);

        layers[type].addLayer(marker);
        counts[type]++;
      });

      const total = counts.hospital + counts.fire_station + counts.police;
      setStatus(`Found: ${counts.hospital} hospitals · ${counts.fire_station} fire stations · ${counts.police} police stations`);
      if (total === 0) setStatus('No emergency services found in this area. Try zooming out.');

    } catch (err) {
      if (err.name !== 'AbortError') {
        setStatus('Failed to load data. Try again.');
      }
    } finally {
      document.getElementById('search-btn').disabled = false;
    }
  }

  // ── Map events ─────────────────────────────────────────────────────────────
  let debounceTimer;
  map.on('moveend zoomend', () => {
    clearTimeout(debounceTimer);
    if (map.getZoom() < 11) {
      Object.values(layers).forEach(l => l.clearLayers());
      setStatus('Zoom in to load emergency services (zoom ≥ 11)');
      return;
    }
    debounceTimer = setTimeout(() => loadEmergencyServices(map.getBounds()), 400);
  });

  // ── Search ─────────────────────────────────────────────────────────────────
  async function searchLocation() {
    const q = document.getElementById('search-input').value.trim();
    if (!q) return;

    setStatus('Searching…', true);
    try {
      const res = await fetch(
        `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1`,
        { headers: { 'Accept-Language': 'en' } }
      );
      const data = await res.json();
      if (!data.length) { setStatus('Location not found. Try a different query.'); return; }
      const { lat, lon, display_name } = data[0];
      map.setView([+lat, +lon], 14);
      setStatus(`Showing: ${display_name.split(',').slice(0, 2).join(',')}`);
    } catch {
      setStatus('Search failed. Check your connection.');
    }
  }

  document.getElementById('search-btn').addEventListener('click', searchLocation);
  document.getElementById('search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') searchLocation();
  });

  // ── Initial load ───────────────────────────────────────────────────────────
  loadEmergencyServices(map.getBounds());
</script>
</body>
</html>
